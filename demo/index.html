<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mounta Demo</title>
<link rel="icon" href="emblem.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Noto+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: the Admin V2 shell (floating white sidebar on a cool ground, soft cards, ink for selection, blue for the action that matters) in Mounta colors. Light, single theme by choice: it mirrors the real product. */
:root{
  --ink:#0D294A; --blue:#1774ED; --sky:#5CBBFF;
  --ground:#F1F5FA; --well:#F4F7FB; --card:#FFFFFF;
  --line:#E2E9F2; --line2:#EBF0F6; --muted:#5B6B82; --soft:#8497B0;
  --act-bg:#E3F0FF; --act:#0958AE;
  --ok:#2E7D4F; --ok-bg:#DDF3E6; --warn:#8A5A12; --warn-bg:#FFF0D6; --bad:#B42335; --bad-bg:#FDE4E7;
  --ff:'Geist','Noto Sans Thai',-apple-system,'Helvetica Neue',sans-serif;
  --mono:'Geist Mono','Noto Sans Thai',ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--ff);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
:focus-visible{outline:3px solid rgba(23,116,237,.35);outline-offset:1px;border-radius:10px}
h1,h2,h3,h4{margin:0;font-weight:500}
p{margin:0}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}

.shell{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:16px;height:calc(100vh - 32px);margin:16px 0 16px 16px;background:var(--card);border-radius:28px;padding:20px 14px 16px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.logo{display:flex;align-items:center;gap:10px;padding:2px 10px 4px}
.logo img{height:30px;width:auto}
.logo b{display:block;font-weight:600;letter-spacing:.14em;font-size:15px}
.logo small{display:block;color:var(--muted);font-size:12px}
.prop{display:flex;align-items:center;gap:10px;background:var(--well);border-radius:22px;padding:10px 14px 10px 10px}
.badge{width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:600;flex:none}
.nav{display:flex;flex-direction:column;gap:2px}
.ni{display:flex;align-items:center;gap:12px;min-height:40px;padding:0 14px;border-radius:999px;border:0;background:none;text-align:left;cursor:pointer;width:100%;font-size:14px}
.ni:hover{background:var(--well)}
.ni svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ni.on{background:var(--ink);color:#fff}
.ni.on svg{stroke:#fff}
.ni .cnt{margin-left:auto;min-width:20px;height:20px;border-radius:10px;background:var(--blue);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 6px}
.grp{font-size:12px;color:var(--muted);padding:4px 14px 2px}
.div{height:1px;background:var(--line2);margin:8px 6px}
.status{background:var(--well);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:3px;font-size:13px}
.status .mono{font-size:11px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

.top{height:80px;padding:0 28px;display:flex;align-items:center;gap:12px}
.crumb{flex:1;min-width:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb span{color:var(--muted)}
.search{flex:0 1 300px;min-width:0;height:44px;border-radius:999px;border:0;background:var(--card);padding:0 18px}
.icb{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;flex:none;position:relative}
.icb svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round}
.icb .cnt{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;border-radius:9px;background:var(--blue);color:#fff;font-size:10px;display:grid;place-items:center}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:13px;flex:none}
.burger{display:none}
.demo{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 14px;border-radius:999px;background:var(--act-bg);color:var(--act);font-size:12px;font-weight:500;white-space:nowrap}
.demo button{border:0;background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:12px}

.content{padding:4px 28px 40px;display:flex;flex-direction:column;gap:16px;min-width:0}
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.ph .lb{font-size:14px;color:var(--muted)}
.ph h1{font-size:34px;font-weight:400;letter-spacing:-.025em;line-height:1.15}
.ph h1 i{font-style:normal;color:var(--soft)}
.ph .sub{font-size:15px;color:var(--muted);margin-top:4px}
.acts{display:flex;gap:10px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;border:0;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;background:var(--ink);color:#fff;text-decoration:none}
.btn:hover{background:#000}
.btn.sec{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px #D2DCE8}
.btn.sec:hover{background:var(--well)}
.btn.blue{background:var(--blue)}
.btn.blue:hover{background:#0F5FCC}
.btn.sm{min-height:34px;padding:0 14px;font-size:13px}
.btn.ghost{background:none;color:var(--ink)}
.btn.ghost:hover{background:var(--well)}
.btn.danger{background:var(--card);color:var(--bad);box-shadow:inset 0 0 0 1px #F3C2C9}
.btn[disabled]{opacity:.4;cursor:not-allowed}

.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.stat{background:var(--card);border-radius:24px;padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.stat .l{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.stat .v{font-size:32px;letter-spacing:-.025em;line-height:1.05;font-variant-numeric:tabular-nums}
.stat .s{font-size:12px;color:var(--muted)}
.card{background:var(--card);border-radius:28px;padding:20px 22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card .card,.well{background:var(--well);border-radius:20px}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ch h3{font-size:15px;font-weight:500}
.cap{font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:4px 10px;border-radius:999px;white-space:nowrap;background:var(--well);color:var(--ink)}
.pill.ink{background:var(--ink);color:#fff}
.pill.act{background:var(--act-bg);color:var(--act)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.out{background:none;color:var(--muted);box-shadow:inset 0 0 0 1px #D2DCE8}
.ab{background:#FFE3E6;color:#A1162B}.bc{background:#DDE8FF;color:#123C99}.ag{background:#E9E1FF;color:#4B2A9E}.tc{background:#DAF1F8;color:#0E5D78}.dr{background:var(--act-bg);color:var(--act)}.at{background:#FFF0D6;color:#8A5A12}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px}
.seg button{border:0;background:none;border-radius:999px;min-height:34px;padding:0 14px;font-size:13px;cursor:pointer}
.seg button.on{background:var(--ink);color:#fff}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-weight:500;font-size:12px;color:var(--muted);padding:0 12px 10px 0;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:11px 12px 11px 0;border-bottom:1px solid var(--line2);white-space:nowrap;vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:#FAFBFD}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2)}
.row:last-child{border-bottom:0}
.row .g{flex:1;min-width:0}
.row .g b{font-weight:500;display:block}
.row .g small{color:var(--muted);font-size:12px}
.lg{display:flex;align-items:center;gap:10px;font-size:13px}
.input,select.input,textarea.input{width:100%;border:1px solid #DCE4EE;border-radius:14px;padding:11px 14px;background:var(--card)}
textarea.input{resize:vertical;min-height:90px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.code{font-family:var(--mono);font-size:30px;letter-spacing:.16em;font-weight:500}
.switch{position:relative;width:40px;height:24px;border-radius:12px;background:#D2DCE8;border:0;cursor:pointer;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.switch[aria-checked="true"]{background:var(--blue)}
.switch[aria-checked="true"]::after{left:19px}

/* room board */
.board{display:grid;gap:5px 3px;font-size:12px;min-width:860px}
.board .d{text-align:center;color:var(--muted);font-size:11.5px;line-height:1.25;padding-bottom:4px}
.board .d.today{color:var(--ink);font-weight:600}
.board .r{font-weight:500;align-self:center;font-size:13px}
.board .r small{display:block;color:var(--muted);font-weight:400;font-size:11px}
.board .cell{border-radius:8px;background:var(--well);border:0;cursor:pointer;min-height:38px}
.board .cell:hover{background:#E8EEF6}
.board .cell.today{box-shadow:inset 0 0 0 1.5px var(--sky)}
.board .bk{border:0;border-radius:9px;padding:0 10px;font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;cursor:pointer;min-height:38px;z-index:1}
.board .bk.in{box-shadow:inset 3px 0 0 currentColor}
.board .bk.ooo{background:repeating-linear-gradient(45deg,#E2E9F2 0 6px,#EEF2F7 6px 12px);color:var(--muted)}

/* drawer, modal, toast */
.scrim{position:fixed;inset:0;background:rgba(13,41,74,.28);z-index:40;display:flex;justify-content:flex-end}
.drawer{width:min(480px,100%);height:100%;background:var(--ground);padding:16px;overflow:auto;display:flex;flex-direction:column;gap:12px;box-shadow:-20px 0 60px -20px rgba(13,41,74,.35)}
.scrim.center{justify-content:center;align-items:center;padding:16px}
.modal{width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--card);border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:16px}
.modal.wide{width:min(820px,100%)}
.modal.bare{background:none;padding:0;width:auto;overflow:visible;align-items:center}
.mh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.mh h2{font-size:22px;letter-spacing:-.02em}
.x{width:40px;height:40px;border-radius:50%;border:0;background:var(--well);cursor:pointer;font-size:18px;flex:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;z-index:60;font-size:14px;box-shadow:0 14px 34px -10px rgba(13,41,74,.5);max-width:calc(100% - 32px)}
pre.csv{margin:0;background:var(--well);border-radius:16px;padding:14px;font-family:var(--mono);font-size:12px;overflow:auto;max-height:260px}

/* phone & tablet for guest views */
.phone{width:320px;max-width:calc(100vw - 32px);height:640px;max-height:calc(100vh - 90px);background:var(--ground);border:10px solid #06162A;border-radius:46px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 40px 80px -20px rgba(0,0,0,.45)}
.phone .notch{height:30px;display:flex;justify-content:center;align-items:center;flex:none}
.phone .notch i{width:88px;height:20px;border-radius:12px;background:#06162A}
.phone .scr{flex:1;overflow:auto;padding:6px 16px 18px;display:flex;flex-direction:column;gap:12px}
.tablet{width:760px;max-width:calc(100vw - 32px);height:540px;max-height:calc(100vh - 90px);background:var(--ground);border:14px solid #06162A;border-radius:34px;overflow:auto;padding:28px;display:flex;flex-direction:column;gap:18px}
.gv-close{margin-top:12px}
.cam{position:relative;height:190px;border-radius:18px;background:#0A1E38;display:grid;place-items:center;overflow:hidden}
.pass{width:72%;height:62%;border-radius:10px;background:#F4F7FB;display:grid;grid-template-columns:34% 1fr;gap:8px;padding:10px}
.pass i{border-radius:6px;background:#CFE3F7}
.pass span{display:flex;flex-direction:column;gap:6px;padding-top:4px}
.pass em{height:6px;border-radius:3px;background:#C9D4E3}
.cam .line{position:absolute;left:10%;right:10%;height:2px;background:var(--sky);box-shadow:0 0 12px 2px rgba(92,187,255,.8);top:10%;display:none}
.cam.scan .line{display:block;animation:scan 1.1s ease-in-out infinite}
@keyframes scan{50%{top:84%}}
.chk{display:flex;gap:10px;align-items:center;padding:12px;border-radius:14px;background:var(--card);cursor:pointer;font-size:13px}
.chk input{width:18px;height:18px;accent-color:var(--blue)}

/* chat */
.chat{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;min-height:560px}
.convs{background:var(--card);border-radius:28px;padding:10px;display:flex;flex-direction:column;gap:2px}
.conv{display:flex;gap:10px;align-items:center;padding:10px;border-radius:18px;border:0;background:none;text-align:left;cursor:pointer;width:100%}
.conv:hover{background:var(--well)}
.conv.on{background:var(--well)}
.av{width:40px;height:40px;border-radius:50%;background:#E2E9F2;display:grid;place-items:center;font-size:13px;font-weight:500;flex:none}
.thread{background:var(--card);border-radius:28px;display:flex;flex-direction:column;min-width:0}
.thread .hd{padding:16px 20px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.msgs{flex:1;padding:18px 20px;display:flex;flex-direction:column;gap:10px;overflow:auto;max-height:440px}
.bub{max-width:72%;padding:10px 14px;border-radius:18px 18px 18px 6px;background:var(--well);font-size:14px}
.bub.me{align-self:flex-end;border-radius:18px 18px 6px 18px;background:var(--ink);color:#fff}
.bub small{display:block;margin-top:6px;padding-top:6px;border-top:1px solid rgba(91,107,130,.25);font-size:12px;opacity:.8}
.bub .t{display:block;font-size:11px;opacity:.6;margin-top:4px}
.composer{padding:12px 16px 16px;border-top:1px solid var(--line2);display:flex;flex-direction:column;gap:10px}
.qr{display:flex;gap:6px;flex-wrap:wrap}
.qr button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:12.5px;cursor:pointer}

/* booking detail */
.bd-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start}
.bd-grid .col{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:1150px){.bd-grid{grid-template-columns:1fr}}
.sr{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px solid var(--line2);font-size:13.5px}
.sr:last-child{border-bottom:0}
.card > .sr + .sr{margin-top:-14px}
.sr span{color:var(--muted)}
.sr b{font-weight:500;text-align:right}
.sr.big b{font-size:18px}
.gt{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--ink);color:#fff;border-radius:16px;padding:14px 18px}
.gt span{display:block;font-size:12px;opacity:.75;letter-spacing:.06em;text-transform:uppercase}
.gt small{display:block;font-size:12px;opacity:.65}
.gt b{font-family:var(--mono);font-size:24px;font-weight:500}
.note{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-radius:18px;padding:12px 16px;font-size:14px}
.note .btn{margin-left:auto}
.note.bad{background:var(--bad-bg);color:var(--bad)}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.dash{border-top:1px dashed var(--line);margin:4px 0}
.ppic{width:40px;height:52px;border-radius:8px;background:linear-gradient(135deg,#DCEBFA,#F4F7FB);flex:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.conv[disabled]{opacity:.5;cursor:not-allowed}
/* charts */
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-family:var(--mono);font-size:10px}

/* rr3 card */
.rr3{border:1.5px solid var(--ink);border-radius:8px;padding:18px;font-size:13px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 20px;background:#fff}
.rr3 .full{grid-column:1/-1}
.rr3 span{display:block;font-size:11px;color:var(--muted)}

/* mobile */
.tabbar{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:280px;height:100%;margin:0;border-radius:0 28px 28px 0;z-index:50;transform:translateX(-105%);transition:transform .2s;box-shadow:20px 0 60px -20px rgba(13,41,74,.4)}
  .side.open{transform:none}
  .burger{display:grid}
  .top{height:64px;padding:0 14px;position:sticky;top:0;z-index:20;background:rgba(241,245,250,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  .search,.top .demo{display:none}
  .content{padding:4px 14px 110px}
  .ph h1{font-size:28px}
  .chat{grid-template-columns:1fr}
  .tabbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--card);border-radius:999px;padding:5px;box-shadow:0 14px 34px -10px rgba(13,41,74,.35)}
  .tabbar button{border:0;background:none;border-radius:999px;min-height:48px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
  .tabbar button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
  .tabbar button.on{background:var(--ink);color:#fff}
  .demo-m{display:flex!important}
}
.demo-m{display:none;margin:0 0 4px}
.side-scrim{display:none}
@media (max-width:900px){.side-scrim.open{display:block;position:fixed;inset:0;background:rgba(13,41,74,.28);z-index:45}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell">
<div class="side-scrim" id="sideScrim"></div>
<aside class="side" id="side">
<a class="logo" href="../" style="text-decoration:none;color:inherit" title="Back to mounta website"><img src="emblem.png" alt=""><div><b>MOUNTA</b><small>Cloud PMS · admin</small></div></a>
<div class="prop"><div class="badge">BD</div><div style="flex:1;min-width:0"><div style="font-weight:600">Baan Doi Loft</div><div class="cap">6 rooms · Chiang Mai</div></div></div>
<nav class="nav" id="nav" aria-label="Main"></nav>
<div class="status"><div style="display:flex;align-items:center;gap:8px;font-weight:500"><span class="dot" style="background:var(--ok)"></span>All systems normal</div><div class="mono">OTA SYNC · 4 CHANNELS</div><div class="mono" id="lockStatus">LOCKS · 4 ONLINE</div></div>
</aside>

<div style="min-width:0">
<header class="top">
<button class="icb burger" id="burger" aria-label="Open menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
<div class="crumb" id="crumb"></div>
<label for="q" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Search</label>
<input id="q" class="search" type="search" placeholder="Search guests, bookings, rooms">
<span class="demo">Demo · sample data <button type="button" data-act="reset">Reset</button></span>
<button class="icb" data-go="chat" aria-label="Chat"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/></svg><span class="cnt" id="bell">3</span></button>
<div class="avatar">PL</div>
</header>
<main class="content" id="main"></main>
</div>
</div>

<nav class="tabbar" id="tabbar" aria-label="Quick"></nav>
<div id="layer"></div>

<script>
(function(){
'use strict';
/* ---------- helpers ---------- */
var TODAY='2026-10-27';

function barChart(data,opts){var W=560,H=180,pl=34,pb=22,max=opts.max,n=data.length,bw=(W-pl)/n;
var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opts.label)+'">';
[0,.5,1].forEach(function(t){var y=H-pb-(H-pb-10)*t;s+='<line x1="'+pl+'" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="#EBF0F6"/><text x="'+(pl-6)+'" y="'+(y+3)+'" text-anchor="end">'+opts.fmt(max*t)+'</text>';});
data.forEach(function(d,i){var x=pl+i*bw+bw*.18,w=bw*.64,y0=H-pb;d.parts.forEach(function(p){var h=(H-pb-10)*p.v/max;y0-=h;if(h>0)s+='<rect x="'+x+'" y="'+y0+'" width="'+w+'" height="'+h+'" rx="3" fill="'+p.c+'"/>';});if(d.label)s+='<text x="'+(x+w/2)+'" y="'+(H-6)+'" text-anchor="middle">'+d.label+'</text>';});
return s+'</svg>';}
function lineChart(vals,labels,label){var W=560,H=170,pl=34,pb=22,n=vals.length,step=(W-pl-8)/(n-1);
var pts=vals.map(function(v,i){return [pl+i*step,H-pb-(H-pb-10)*v/100];});
var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(label)+'">';
[0,50,100].forEach(function(t){var y=H-pb-(H-pb-10)*t/100;s+='<line x1="'+pl+'" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="#EBF0F6"/><text x="'+(pl-6)+'" y="'+(y+3)+'" text-anchor="end">'+t+'%</text>';});
s+='<path d="M'+pts[0][0]+' '+(H-pb)+' L'+pts.map(function(p){return p.join(' ');}).join(' L')+' L'+pts[n-1][0]+' '+(H-pb)+'Z" fill="rgba(23,116,237,.12)"/>';
s+='<path d="M'+pts.map(function(p){return p.join(' ');}).join(' L')+'" fill="none" stroke="#1774ED" stroke-width="2"/>';
s+='<circle cx="'+pts[n-1][0]+'" cy="'+pts[n-1][1]+'" r="4" fill="#1774ED"/>';
labels.forEach(function(l,i){if(l)s+='<text x="'+(pl+i*step)+'" y="'+(H-6)+'" text-anchor="middle">'+l+'</text>';});
return s+'</svg>';}

function addLeadOcc(b){var g=G(b.g);if(g.no&&!b.occ.some(function(o){return o.no===g.no;}))b.occ.unshift(occOf(g));}

A.bf=function(el){var b=cur(),f=el.dataset.bf,v=el.value;if(!b)return;
if(f==='status'){var map={checked_in:'checkin',checked_out:'checkout'};if(map[v]){A[map[v]]({dataset:{id:b.id}});return;}if(v==='no_show'){A.noShow();return;}if(v==='cancelled'){A.cancelOpen();render();return;}if(v==='confirmed'){if(b.status==='cancelled'||b.status==='no_show'){A.restore();return;}b.status='confirmed';}render();return;}
if(f==='in'||f==='out'){var a=f==='in'?v:b.in,z=f==='out'?v:b.out;if(!(a<z)){toast('Check-out must be after check-in');render();return;}var c=clashFor(b,b.room,a,z);if(c){toast(R(b.room).name+' is taken by '+G(c.g).name+' on those dates');render();return;}b.in=a;b.out=z;rebuildRates(b);log('Ploy','Dates changed · '+b.id+' · '+fd(a)+' → '+fd(z));render();toast('Dates updated · rates rebuilt');return;}
if(f==='ch'){b.ch=v;if(v==='agent'&&!b.agent)b.agent={name:S.agents[0].name,contact:S.agents[0].contact,phone:'—',email:'—',voucher:'',rate:S.agents[0].disc,terms:'Monthly'};render();return;}
if(f==='agentName'){var ag=S.agents.find(function(x){return x.name===v;});b.agent.name=v;b.agent.contact=ag.contact;b.agent.rate=ag.disc;render();return;}
if(f==='voucher'){b.agent.voucher=v;return;}
if(f==='plates'){b.plates=v.split(',').map(function(s){return s.trim();}).filter(Boolean);render();return;}
if(f==='guestsN'){b.guestsN=Math.max(1,parseInt(v,10)||1);render();return;}
if(f==='door'){var d=v.replace(/\D/g,'');b.door=d?{code:d,onLock:false}:null;render();return;}
b[f]=v;toast('Saved');};

A.bulkRate=function(){modal(mh('Set a price range')+'<div class="form"><label class="f" for="br_t">Room type<select id="br_t" class="input">'+Object.keys(S.rates).map(function(t){return '<option>'+t+'</option>';}).join('')+'</select></label><label class="f" for="br_a">From<input id="br_a" type="date" class="input" value="'+D(7)+'"></label><label class="f" for="br_b">To<input id="br_b" type="date" class="input" value="'+D(13)+'"></label><label class="f" for="br_p">Price (฿)<input id="br_p" type="number" class="input" value="1800"></label></div><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn sec" data-act="closeModal">Cancel</button><button class="btn" data-act="saveBulk">Apply</button></div>');};
A.saveBulk=function(){var t=document.getElementById('br_t').value,a=document.getElementById('br_a').value,b=document.getElementById('br_b').value,p=parseInt(document.getElementById('br_p').value,10);var n=0;for(var d=a;d<=b&&n<90;d=addDays(d,1)){S.rateOv[t+'|'+d]=p;n++;}log('Ploy',t+' '+fd(a)+'–'+fd(b)+' set to '+baht(p));closeModal();render();toast(n+' dates updated');};
A.sync=function(el){var c=S.channels.find(function(x){return x.id===el.dataset.id;});el.textContent='Syncing…';el.disabled=true;setTimeout(function(){c.last=now();log('System',CH[c.id].n+' synced · no changes');render();toast(CH[c.id].n+' synced');},900);};

A.copyAgent=function(){A.copy({dataset:{v:'https://app.mounta.co/agent/baan-doi-loft'}});};

A.tm30Export=function(){var list=S.bookings.filter(function(b){return live(b)&&b.in<=TODAY&&b.out>=TODAY&&b.status!=='checked_out'&&G(b.g).nat!=='THA'&&b.form==='done';});var csv='first_name,last_name,nationality,passport_no,date_of_birth,arrival,departure,room\n'+list.map(function(b){var g=G(b.g),p=g.name.split(' ');return [p[0],p.slice(1).join(' '),g.nat,g.no,g.dob,b.in,b.out,R(b.room).name].join(',');}).join('\n');
log('Ploy','TM30 file exported · '+list.length+' guests');modal(mh('TM30 file · '+fd(TODAY),list.length+' foreign guests')+'<pre class="csv">'+esc(csv)+'</pre><span class="cap">In the real system this downloads as a file ready for the immigration TM30 upload.</span><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn sec" data-act="copy" data-v="'+esc(csv)+'">Copy</button><button class="btn" data-act="closeModal">Done</button></div>','wide');};
A.rr3=function(el){var b=B(el.dataset.id),g=G(b.g);modal(mh('ร.ร.3 · บัตรทะเบียนผู้พัก','Guest registration card')+rr3Card(b,g)+'<div style="display:flex;justify-content:flex-end"><button class="btn" data-act="closeModal">Done</button></div>','wide');};
A.rr3All=function(){var list=S.bookings.filter(function(b){return live(b)&&b.in<=TODAY&&b.out>=TODAY&&b.status!=='checked_out'&&b.form==='done';});modal(mh('ร.ร.3 cards · '+fd(TODAY),list.length+' cards')+list.map(function(b){return rr3Card(b,G(b.g));}).join('')+'<div style="display:flex;justify-content:flex-end"><button class="btn" data-act="closeModal">Done</button></div>','wide');};
function rr3Card(b,g){return '<div class="rr3"><div class="full" style="display:flex;justify-content:space-between"><b>'+esc(S.settings.name)+'</b><span class="mono">ร.ร.3 · '+b.id+'</span></div><div><span>ชื่อ-สกุล / Name</span>'+esc(g.name)+'</div><div><span>สัญชาติ / Nationality</span>'+g.nat+'</div><div><span>เอกสาร / Document</span>'+esc(g.doc)+' '+esc(g.no)+'</div><div><span>วันเกิด / Date of birth</span>'+(g.dob||'—')+'</div><div><span>ห้อง / Room</span>'+R(b.room).name+'</div><div><span>วันเข้า-ออก / Stay</span>'+fd(b.in)+' → '+fd(b.out)+'</div><div class="full"><span>ที่อยู่ที่พัก / Address</span>'+esc(S.settings.addr)+'</div></div>';}
A.hkTab=function(el){UI.hkTab=el.dataset.v;render();};
A.hkNext=function(el){var r=R(el.dataset.id),nx={dirty:'cleaning',cleaning:'clean',clean:'inspected',inspected:'dirty'};r.hk=nx[r.hk];if(r.hk==='clean')r.photos=4;log(r.hkBy,r.name+' → '+r.hk);render();};
A.endOoo=function(el){var r=R(el.dataset.id);r.hk='dirty';r.ooo=null;log('Ploy',r.name+' back in service');render();toast(r.name+' is back in service');};
A.reqDone=function(el){S.requests[+el.dataset.i].done=true;render();};

A.lReturn=function(el){S.laundry.hist[+el.dataset.i].status='Returned';render();};
A.closeDay=function(){S.audit.closed=now();log('Ploy','Day closed · night audit '+fd(TODAY));render();toast('Day closed');};
A.payTab=function(el){UI.payTab=el.dataset.v;render();};
A.importPayout=function(){var src=S.payout.src;var mine=S.bookings.filter(function(b){return b.ch===src&&live(b)&&b.paid>0;}).slice(0,6);var rows=mine.map(function(b){return {ref:({airbnb:'G-',booking:'BKP-',trip:'TRP-'}[src])+rnd(6),n:G(b.g).name,s:fd(b.in)+' → '+fd(b.out),a:b.total-fee(b),b:b.id};});rows.push({ref:({airbnb:'G-',booking:'BKP-',trip:'TRP-'}[src])+rnd(6),n:'Resolution adjustment',s:'—',a:-350,b:null});S.payout.rows=rows;log('Kwan','Imported '+CH[src].n+' payout · '+rows.length+' lines');render();toast('Matched '+(rows.length-1)+' of '+rows.length+' lines');};
A.importBank=function(){S.bank=[{d:D(-1),t:'AIRBNB PAYMENTS UK',a:4080,m:'Airbnb payout · MT-1031'},{d:D(-1),t:'BEAM CHECKOUT',a:3400,m:'Beam · 2 payments'},{d:D(-2),t:'BOOKING.COM BV',a:3570,m:'Booking.com payout · MT-1029'},{d:D(-3),t:'TRANSFER FROM NOK S.',a:1200,m:null},{d:D(-5),t:'PEA ELECTRICITY',a:-6420,m:'Expense · Electricity Sep'},{d:D(-6),t:'ATM WITHDRAWAL',a:-2000,m:null}];log('Kwan','Imported KBank statement');render();toast('2 lines need a look');};
A.addExpense=function(){modal(mh('Add expense')+'<div class="form"><label class="f" for="ex_d">Date<input id="ex_d" type="date" class="input" value="'+TODAY+'"></label><label class="f" for="ex_c">Category<select id="ex_c" class="input">'+['Supplies','Laundry','Utilities','Repairs','Staff','Internet','Marketing'].map(function(c){return '<option>'+c+'</option>';}).join('')+'</select></label><label class="f" for="ex_t">Description<input id="ex_t" class="input"></label><label class="f" for="ex_a">Amount (฿)<input id="ex_a" type="number" class="input"></label></div><label class="f" for="ex_s">Slip photo<input id="ex_s" type="file" accept="image/*" class="input"></label><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn sec" data-act="closeModal">Cancel</button><button class="btn" data-act="saveExpense">Save</button></div>');};
A.saveExpense=function(){var a=parseInt(document.getElementById('ex_a').value,10),t=document.getElementById('ex_t').value.trim();if(!a||!t){toast('Enter a description and amount');return;}S.expenses.unshift({date:document.getElementById('ex_d').value,cat:document.getElementById('ex_c').value,desc:t,amt:a,slip:!!document.getElementById('ex_s').files.length});log('Ploy','Expense '+t+' '+baht(a));closeModal();render();toast('Expense saved');};
A.exportAcc=function(){var csv='date,category,description,amount,slip\n'+S.expenses.map(function(e){return [e.date,e.cat,'"'+e.desc+'"',e.amt,e.slip?'yes':'no'].join(',');}).join('\n');modal(mh('Export for accountant','Expenses · October 2026')+'<pre class="csv">'+esc(csv)+'</pre><span class="cap">The real system exports a package with slips, or sends it to Google Sheets.</span><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn sec" data-act="copy" data-v="'+esc(csv)+'">Copy</button><button class="btn" data-act="closeModal">Done</button></div>','wide');};
A.repTab=function(el){UI.repTab=el.dataset.v;render();};
A.gvCheckin=function(el){UI.drawer=null;gvCheckin(el.dataset.id);};
A.gvNext=function(){GV.step++;GV.read=false;paintGv();};
A.gvScan=function(){GV.scanning=true;paintGv();setTimeout(function(){GV.scanning=false;GV.read=true;if(UI.modal)paintGv();},1400);};
A.gvConfirm=function(){var all=Array.prototype.every.call(document.querySelectorAll('[data-rule]'),function(c){return c.checked;});if(!all){document.getElementById('ruleMsg').textContent='Tick every rule to continue.';return;}var b=B(GV.b);b.form='done';addLeadOcc(b);if(!b.door)issue(b);log(G(b.g).name,'Completed online check-in · passport read from photo');GV.step=3;paintGv();render();};
A.gvPass=function(el){UI.drawer=null;gvPass(el.dataset.id);};
A.gvReq=function(el){var b=B(el.dataset.id);S.requests.unshift({room:b.room,what:el.dataset.w,at:now(),done:false});log(G(b.g).name,'Requested '+el.dataset.w.toLowerCase()+' from stay pass');render();toast('Request sent to housekeeping');};
A.gvMsg=function(el){var b=B(el.dataset.id),c=S.chats.find(function(x){return x.b===b.id;});if(!c){c={b:b.id,unread:0,m:[]};S.chats.unshift(c);}c.m.push({f:'g',t:'Hello! Where can I buy a SIM card nearby?',tr:'สวัสดี ซื้อซิมการ์ดใกล้ๆ ได้ที่ไหน',at:now()});c.unread++;render();toast('Message sent · see Chat');};
A.gvKiosk=function(){gvKiosk();};
A.kWalk=function(){KS.step=1;paintKiosk();};A.kHave=function(){KS.step=4;paintKiosk();};A.kBack=function(){KS.step=0;paintKiosk();};
A.kRoom=function(el){KS.room=el.dataset.id;KS.step=2;paintKiosk();};
A.kPaid=function(){var r=R(KS.room),gid='gk'+Date.now()%10000,id='MT-'+(1053+S.bookings.length);S.guests.push({id:gid,name:'Walk-in guest',nat:'THA',doc:'Thai ID',no:'',dob:'',lang:'th',phone:'',email:''});var b={id:id,ref:id,g:gid,room:r.id,in:TODAY,out:D(1),ch:'direct',status:'checked_in',adults:1,total:rateFor(r.type,TODAY),paid:rateFor(r.type,TODAY),form:'none',door:null,pay:null,notes:'Walk-in at kiosk'};S.bookings.push(b);enrich(b,S.bookings.length,S.guests);sync(b);issue(b);KS.code=b.door.code;log('Kiosk','Walk-in booked '+r.name+' · paid by PromptPay');KS.step=3;paintKiosk();render();};
A.kDone=function(){closeModal();};
A.kFind=function(){var q=document.getElementById('kq').value.trim().toLowerCase();var b=q&&S.bookings.find(function(x){return live(x)&&x.in===TODAY&&(G(x.g).name.toLowerCase().indexOf(q)>=0||x.id.toLowerCase()===q);});document.getElementById('kres').innerHTML=b?'<div class="card"><b style="font-weight:600">'+esc(G(b.g).name)+' · '+R(b.room).name+'</b><span class="cap">'+fd(b.in)+' → '+fd(b.out)+'</span><button class="btn blue" style="align-self:flex-start" data-act="kCheck" data-id="'+b.id+'">Check in now</button></div>':'<div class="empty">No arrival today matches. Try สมชาย or MT-1044.</div>';};
A.kCheck=function(el){var b=B(el.dataset.id);b.status='checked_in';if(!b.door)issue(b);KS.room=b.room;KS.code=b.door.code;log('Kiosk','Checked in '+G(b.g).name);KS.step=3;paintKiosk();render();};
A.staffSel=function(el){UI.staffSel=+el.dataset.i;render();};
A.perm=function(el){var s=S.staff[UI.staffSel],m=el.dataset.m,i=s.perms.indexOf(m);if(i>=0)s.perms.splice(i,1);else s.perms.push(m);log('Ploy',s.name+': '+m+(i>=0?' removed':' allowed'));render();};
A.addStaff=function(){modal(mh('Add staff')+'<div class="form"><label class="f" for="st_n">Name<input id="st_n" class="input"></label><label class="f" for="st_r">Role<select id="st_r" class="input"><option>Front desk</option><option>Housekeeper</option><option>Accountant</option><option>Manager</option></select></label></div><span class="cap">They get a sign-in link by email. You choose their menus next.</span><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn sec" data-act="closeModal">Cancel</button><button class="btn" data-act="saveStaff">Add</button></div>');};
A.saveStaff=function(){var n=document.getElementById('st_n').value.trim();if(!n)return;var r=document.getElementById('st_r').value;S.staff.push({name:n,role:r,perms:r==='Housekeeper'?['Housekeeping','Laundry']:['Overview','Bookings']});UI.staffSel=S.staff.length-1;log('Ploy','Added staff '+n);closeModal();render();toast('Invite sent to '+n);};
A.saveSettings=function(){var s=S.settings;['name','addr','cin','cout','wifi','wifipw'].forEach(function(k){s[k]=document.getElementById('s_'+k).value;});s.rules=document.getElementById('s_rules').value;log('Ploy','Settings saved');toast('Settings saved');render();};

/* ---------- routing ---------- */
function go(r){if(!P[r])r='overview';UI.route=r;try{if(location.hash.slice(1)!==r)history.replaceState(null,'','#'+r);}catch(e){}document.getElementById('side').classList.remove('open');document.getElementById('sideScrim').classList.remove('open');render();window.scrollTo(0,0);}
function render(){renderNav();document.getElementById('main').innerHTML=P[UI.route]();var m=document.getElementById('msgs');if(m)m.scrollTop=m.scrollHeight;}

document.addEventListener('click',function(e){
var stop=e.target.closest('[data-stop]');var el=e.target.closest('[data-act],[data-go]');
if(!el){return;}
if(stop&&!stop.contains(el))return;
if((el.dataset.act==='closeDrawer'||el.dataset.act==='closeModal')&&el.classList.contains('scrim')&&e.target!==el)return;
if(el.tagName==='SELECT')return;
if(el.dataset.go){go(el.dataset.go);return;}
var f=A[el.dataset.act];if(f){e.preventDefault();f(el);}});
document.addEventListener('change',function(e){var el=e.target;var k=el.dataset.change;if(!k)return;
if(k==='bCh'){UI.bCh=el.value;render();}if(k==='hkBy'){R(el.dataset.id).hkBy=el.value;}if(k==='psrc'){S.payout.src=el.value;S.payout.rows=null;render();}});
document.addEventListener('change',function(e){var el=e.target;if(el.dataset.bf)A.bf(el);else if(el.dataset.gf)A.gf(el);else if(el.dataset.rate!==undefined)A.rate(el);});
document.addEventListener('input',function(e){var el=e.target;if(el.id==='q'){UI.q=el.value;if(UI.route!=='bookings'&&UI.route!=='guests')UI.route='bookings';render();el.focus();}if(el.dataset.input==='counted'){S.audit.counted=el.value.replace(/[^0-9]/g,'');var v=S.audit.counted===''?null:Number(S.audit.counted)-6200;document.getElementById('variance').innerHTML=v===null?'Count the drawer and enter the amount.':v===0?'<span style="color:var(--ok)">Matches expected cash.</span>':'<span style="color:var(--bad)">Variance '+(v>0?'+':'−')+baht(Math.abs(v))+'</span>';}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(UI.modal)closeModal();else if(UI.drawer)A.closeDrawer();}if(e.key==='Enter'&&e.target.id==='msgIn')A.send();if(e.key==='Enter'&&e.target.id==='kq')A.kFind();});
document.getElementById('burger').addEventListener('click',A.menu);
document.getElementById('sideScrim').addEventListener('click',function(){document.getElementById('side').classList.remove('open');this.classList.remove('open');});
window.addEventListener('hashchange',function(){var r=location.hash.slice(1);if(r&&r!==UI.route&&P[r])go(r);});
var start=location.hash.slice(1);if(start==='booking')start='bookings';go(P[start]?start:'overview');
})();
</script>
