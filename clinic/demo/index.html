<style>
/* ===== Mounta Cloud design system ===== */
:root{
  --plum:#123a4a;--plum2:#1d5568;--rose:#1592a5;--rose-d:#0e7686;--rose-l:#e3f4f6;--accent:#7fd3dd;
  --bg:#f1f6f8;--card:#fff;--ink:#1c2a33;--mute:#7b8b94;--line:#e5edf0;
  --ok:#2f9a6a;--ok-l:#e3f5ec;--warn:#c4860f;--warn-l:#fcf1dc;--bad:#d4574e;--bad-l:#fdeceb;--info:#4f6fd0;--info-l:#e9eefc;--vio:#7d62c9;--vio-l:#efeafb;--pink:#d9607e;--pink-l:#fdebef;
  --r:16px;--sh:0 1px 2px rgba(16,57,74,.04),0 6px 20px rgba(16,57,74,.05);
  --font:'Plus Jakarta Sans','IBM Plex Sans Thai',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;display:flex;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
b,strong{font-weight:600}
/* ---- sidebar ---- */
.side{width:248px;flex:none;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;height:100vh;position:sticky;top:0;padding:18px 14px 14px;gap:14px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px}
.brand .mk{width:46px;height:36px;display:grid;place-items:center;flex:none}
.brand .mk img{width:46px;height:auto;display:block}
.lg-brand .brand .mk{width:58px;height:46px;background:#fff;border-radius:12px;padding:5px 6px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.lg-brand .brand .mk img{width:100%}
.brand .wm{font-size:19px;font-weight:700;letter-spacing:-.3px;line-height:1}
.brand .wm span{color:var(--rose)}
.brand .wm small{display:block;font-size:10px;font-weight:500;color:var(--mute);letter-spacing:1.4px;text-transform:uppercase;margin-top:4px}
.tenant{display:flex;align-items:center;gap:10px;background:#f6f9fa;border:1px solid var(--line);border-radius:14px;padding:9px 11px}
.tenant .ic{width:32px;height:32px;border-radius:9px;background:var(--rose-l);color:var(--rose-d);display:grid;place-items:center;flex:none}
.tenant b{display:block;font-size:13px;line-height:1.25}
.tenant small{color:var(--mute);font-size:11px}
.nav{flex:1;overflow:auto;margin:0 -4px;padding:0 4px}
.nav .sec{font-size:10.5px;letter-spacing:1.6px;color:#9aa8b0;padding:12px 10px 6px;text-transform:uppercase;font-weight:600}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:11px;text-decoration:none;color:#4e5f69;margin-bottom:2px;font-weight:500;position:relative}
.nav a:hover{background:#f3f7f8;color:var(--ink)}
.nav a.on{background:var(--rose-l);color:var(--rose-d);font-weight:600}
.nav a.on:before{content:'';position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--rose)}
.nav svg{width:18px;height:18px;flex:none}
.nav .bd{margin-left:auto;background:var(--bad-l);color:var(--bad);font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px;min-width:20px;text-align:center}
.duty{border-radius:16px;padding:14px;color:#cfe6ec;background:radial-gradient(circle at 85% 15%,rgba(127,211,221,.35),transparent 45%),linear-gradient(150deg,var(--plum2),var(--plum));position:relative;overflow:hidden}
.duty small{font-size:11px;opacity:.8}
.duty .avs{display:flex;margin:8px 0 8px}
.duty .avs .av{border:2px solid var(--plum);margin-right:-7px}
.duty b{color:#fff;display:block;font-size:13px}
.duty .t2{font-size:11.5px;opacity:.75}
.side-foot{display:flex;align-items:center;gap:10px;padding:4px 4px 0}
.side-foot .who{flex:1;min-width:0}
.side-foot .who b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-foot .who small{color:var(--mute);font-size:11px}
.ibtn{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;color:#53646e;position:relative;flex:none}
.ibtn:hover{border-color:var(--rose);color:var(--rose-d)}
.ibtn svg{width:17px;height:17px}
.ibtn.sm{width:30px;height:30px;border-radius:9px}.ibtn.sm svg{width:15px;height:15px}
.ibtn .n{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;border-radius:99px;padding:1px 5px;border:2px solid #fff}
/* ---- top bar ---- */
main{flex:1;min-width:0;height:100vh;overflow:auto}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 30px;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.gsearch{position:relative;flex:0 1 420px}
.gsearch input{width:100%;border:1px solid var(--line);background:#f5f8f9;border-radius:12px;padding:10px 54px 10px 38px;outline:none}
.gsearch input:focus{background:#fff;border-color:var(--rose);box-shadow:0 0 0 3px rgba(21,146,165,.12)}
.gsearch > svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:#90a0a8}
.gsearch kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:600 11px var(--font);color:#94a3ab;background:#fff;border:1px solid var(--line);border-radius:6px;padding:2px 6px}
.gres{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 40px rgba(16,57,74,.14);padding:6px;display:none;z-index:30}
.gres.show{display:block}
.gres a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;text-decoration:none;cursor:pointer}
.gres a:hover,.gres a.sel{background:var(--rose-l)}
.datechip{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13px;color:#33444d;white-space:nowrap}
.datechip svg{width:16px;height:16px;color:#8b9aa2}
.datechip span{color:var(--mute);font-weight:500}
.topbar .sp{flex:1}
.phead{display:flex;align-items:flex-end;justify-content:space-between;padding:24px 30px 4px;gap:16px;flex-wrap:wrap}
.phead h1{margin:0;font-size:25px;font-weight:700;letter-spacing:-.4px}
.phead .sub{color:var(--mute);font-size:13.5px;margin-top:3px}
.top-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#view{padding:18px 30px 40px}
/* ---- cards & layout ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:20px}
.card h3{margin:0 0 14px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px;letter-spacing:-.1px}
.card h3 small{font-weight:500;color:var(--mute);font-size:12px}
.card h3 a.lnk,.lnk{color:var(--rose-d);font-size:12.5px;font-weight:600;text-decoration:none;cursor:pointer}
.grid{display:grid;gap:18px}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2.1fr) minmax(0,1fr)}
.g12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.kpi{padding:16px 18px}
.kpi .l{color:var(--mute);font-size:13px;display:flex;align-items:center;gap:9px;font-weight:500}
.kpi .v{font-size:28px;font-weight:700;margin:10px 0 2px;letter-spacing:-.6px}
.kpi .v small{font-size:13px;color:var(--mute);font-weight:500;letter-spacing:0;margin-left:3px}
.kpi .d{font-size:12px;color:var(--mute)}
.kpi .d b.up{color:var(--ok)} .kpi .d b.dn{color:var(--bad)}
.kic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--rose-l);color:var(--rose-d)}
.kic svg{width:16px;height:16px}
.kic.ok{background:var(--ok-l);color:var(--ok)}.kic.warn{background:var(--warn-l);color:var(--warn)}.kic.vio{background:var(--vio-l);color:var(--vio)}.kic.bad{background:var(--pink-l);color:var(--pink)}.kic.info{background:var(--info-l);color:var(--info)}
.spark{display:block;margin-top:6px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 15px;cursor:pointer;font-weight:600;white-space:nowrap;text-decoration:none;font-size:13.5px;color:#2d3d46}
.btn svg{width:16px;height:16px}
.btn:hover{border-color:#c9d8dd;background:#fafcfd}
.btn.p{background:var(--plum);border-color:var(--plum);color:#fff}
.btn.p:hover{background:var(--plum2)}
.btn.r{background:var(--rose);border-color:var(--rose);color:#fff;box-shadow:0 6px 14px rgba(21,146,165,.22)}
.btn.r:hover{background:var(--rose-d)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--rose-l);color:var(--rose-d)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 11px;font-size:12px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.xs{font-size:10px;padding:0 6px}
.chip.ok{background:var(--ok-l);color:var(--ok)} .chip.warn{background:var(--warn-l);color:var(--warn)}
.chip.bad{background:var(--bad-l);color:var(--bad)} .chip.info{background:var(--info-l);color:var(--info)}
.chip.mute{background:#eef3f5;color:#5f717b} .chip.teal{background:var(--rose-l);color:var(--rose-d)} .chip.vio{background:var(--vio-l);color:var(--vio)}
.tier{display:inline-block;padding:2px 9px;border-radius:7px;font-size:11px;font-weight:700;letter-spacing:.3px}
.tier.Platinum{background:#1d2b33;color:#dfeef2} .tier.Gold{background:#fbefcf;color:#8a6414}
.tier.Silver{background:#e9eef1;color:#55636c} .tier.Member{background:var(--rose-l);color:var(--rose-d)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:600;color:#8a99a1;font-size:11.5px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;text-transform:uppercase;letter-spacing:.4px}
td{padding:11px 12px;border-bottom:1px solid #eef3f5;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.click{cursor:pointer} tr.click:hover td{background:#f7fbfc}
.num{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--mute)} .small{font-size:12px}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.toolbar .sp{flex:1}
.inp{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 12px;outline:none;min-width:0}
.inp:focus{border-color:var(--rose);box-shadow:0 0 0 3px rgba(21,146,165,.12)}
.search{min-width:260px}
.tabs{display:inline-flex;background:#e9f0f3;border-radius:12px;padding:3px;gap:2px}
.tabs button{border:none;background:none;padding:7px 14px;border-radius:9px;cursor:pointer;color:#62737c;font-weight:500}
.tabs button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(16,57,74,.08)}
.list-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #eef3f5}
.list-row:last-child{border-bottom:none}
.list-row.click{cursor:pointer;border-radius:10px} .list-row.click:hover{background:#f7fbfc}
.time{font-weight:700;font-variant-numeric:tabular-nums;width:48px;flex:none}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar,.av{width:36px;height:36px;border-radius:50%;background:var(--rose-l);color:var(--rose-d);display:grid;place-items:center;font-weight:700;flex:none;font-size:13px}
.av.sm{width:30px;height:30px;font-size:11.5px}
.avatar.lg{width:64px;height:64px;font-size:24px}
.empty{color:var(--mute);text-align:center;padding:26px 0}
.alert{border-radius:12px;padding:10px 14px;background:var(--bad-l);color:var(--bad);font-weight:600;margin:12px 0;display:flex;gap:9px;align-items:flex-start}
.alert small{display:block;font-weight:400;opacity:.85}
.alert.warn{background:var(--warn-l);color:var(--warn)}
/* charts */
.bars{display:flex;align-items:flex-end;gap:6px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bar{width:100%;max-width:30px;background:linear-gradient(180deg,#4fb7c6,var(--rose));border-radius:7px 7px 3px 3px;min-height:2px}
.bar.hl{background:linear-gradient(180deg,var(--plum2),var(--plum))}
.bval{font-size:10px;color:var(--mute);margin-bottom:3px;white-space:nowrap}
.blab{font-size:10px;color:var(--mute);margin-top:6px;white-space:nowrap}
.hb{margin-bottom:12px}
.hb .t{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.hb .tr{height:8px;background:#edf3f5;border-radius:99px;overflow:hidden}
.hb .f{height:100%;background:var(--rose);border-radius:99px}
.prog{height:6px;background:#edf3f5;border-radius:99px;overflow:hidden;width:100%}
.prog i{display:block;height:100%;background:var(--rose);border-radius:99px}
.donut-wrap{display:flex;align-items:center;gap:20px}
.legend2 div{display:flex;align-items:center;gap:8px;font-size:13px;margin:6px 0}
.legend2 i{width:9px;height:9px;border-radius:50%;display:inline-block}
/* schedule */
.sched{display:flex;overflow-x:auto;border-radius:14px;background:#fff}
.card .sched{margin:0 -4px}
.tcol{width:62px;flex:none}
.tslot{position:absolute;right:10px;font-size:11px;color:#9aa8b0;transform:translateY(-50%);font-variant-numeric:tabular-nums}
.tslot:first-child{transform:translateY(2px)}
.nowpill{position:absolute;right:4px;transform:translateY(-50%);background:var(--bad);color:#fff;font-size:10.5px;font-weight:700;border-radius:6px;padding:1px 6px;z-index:3}
.ghead{height:58px;padding:10px 10px;display:flex;align-items:center;gap:9px;line-height:1.25;background:#fff;position:sticky;top:0;z-index:2}
.ghead b{display:block;font-size:13px}
.ghead small{display:block;color:var(--mute);font-weight:400;font-size:11px}
.gcol{flex:1;min-width:190px}
.gbody{position:relative;cursor:copy;margin:0 4px;background-image:linear-gradient(to bottom,#e8eff2 1px,transparent 1px);border-left:1px dashed #e8eff2}
.gbody.ro{cursor:default}
.ablock{position:absolute;left:4px;right:4px;border-radius:10px;padding:5px 9px;font-size:12px;cursor:pointer;overflow:hidden;border-left:3px solid;line-height:1.35;display:flex;flex-direction:column;gap:1px}
.ablock b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ablock span{color:#5d6f78;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ablock.booked{background:#eef7f9;border-color:#7cc3cf}
.ablock.arrived{background:#fff6e6;border-color:#f0b54a}
.ablock.done{background:#f1f3f9;border-color:#a6b2e6;opacity:.85}
.ablock.cancel{background:#f6f6f7;border-color:#d5d9dc;opacity:.55;text-decoration:line-through}
.ablock.cur{box-shadow:0 0 0 2px var(--rose);background:#fff}
.ablock:hover{filter:brightness(.98);box-shadow:0 4px 12px rgba(16,57,74,.1)}
.nowline{position:absolute;left:-4px;right:0;height:2px;background:var(--bad);z-index:2;pointer-events:none;opacity:.7}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);align-items:center;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* queue */
.serving{border-radius:16px;padding:16px 18px;color:#d7f0f4;background:radial-gradient(circle at 92% 70%,rgba(255,255,255,.16) 0 46px,transparent 47px),linear-gradient(140deg,#1aa3b6,var(--rose-d));margin-bottom:10px;cursor:pointer}
.serving small{font-size:12px;opacity:.85}
.serving .q{font-size:34px;font-weight:800;color:#fff;letter-spacing:-.5px;line-height:1.15;margin:4px 0}
.serving .r{display:flex;justify-content:space-between;align-items:center;color:#fff;font-weight:600}
.serving .r span{font-size:11.5px;background:rgba(255,255,255,.18);border-radius:99px;padding:2px 9px;font-weight:500}
.qrow{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid #eef3f5;cursor:pointer;border-radius:8px}
.qrow:hover{background:#f7fbfc}.qrow:last-child{border-bottom:none}
.qno{font-weight:700;font-size:12px;color:#53646e;background:#f1f5f7;border-radius:8px;padding:4px 7px;font-variant-numeric:tabular-nums;flex:none}
.qw{text-align:right;font-size:12px;color:var(--mute);line-height:1.2;flex:none}.qw b{display:block;color:var(--ink);font-size:13px}
/* patient record */
.pt-grid{display:grid;grid-template-columns:330px minmax(0,1fr);gap:18px;align-items:start}
.pt-card{text-align:center}
.pt-av{width:84px;height:84px;border-radius:22px;margin:4px auto 12px;display:grid;place-items:center;font-size:28px;font-weight:700;color:#b5573a;background:linear-gradient(150deg,#fde3d6,#f8c7b1);position:relative}
.pt-av i{position:absolute;right:-3px;bottom:-3px;width:16px;height:16px;border-radius:50%;background:var(--ok);border:3px solid #fff}
.pt-card h2{margin:0;font-size:20px;letter-spacing:-.3px}
.pt-card .chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px 0 4px}
.pt-kv{text-align:left;border-top:1px solid #eef3f5;margin-top:14px;padding-top:12px;display:grid;grid-template-columns:auto 1fr;gap:9px 12px;font-size:13px}
.pt-kv dt{color:var(--mute)} .pt-kv dd{margin:0;text-align:right;font-weight:600}
.vit{padding:14px 16px}
.vit .l{font-size:12.5px;color:var(--mute);display:flex;gap:6px;align-items:center}
.vit .v{font-size:24px;font-weight:700;margin:6px 0 6px;letter-spacing:-.4px}
.vit .v small{font-size:12px;color:var(--mute);font-weight:500}
.soap{display:flex;gap:10px;align-items:flex-start;margin:9px 0;font-size:13.5px;line-height:1.5}
.soap i{font-style:normal;width:22px;height:22px;border-radius:7px;background:var(--rose-l);color:var(--rose-d);font-size:11px;font-weight:700;display:grid;place-items:center;flex:none}
.medrow{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid #eef3f5}
.medrow:last-child{border-bottom:none}
.medic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:15px}
.rng{position:relative;height:6px;border-radius:99px;background:linear-gradient(90deg,#e6f4ee,#e9f3f6 60%,#fbeaea);width:90px;flex:none}
.rng i{position:absolute;top:-4px;width:4px;height:14px;border-radius:3px;background:var(--plum)}
/* treatment timeline */
.tl{position:relative}
.tl:before{content:'';position:absolute;left:86px;top:6px;bottom:6px;width:2px;background:#dfe8ec}
.tl-m{margin:6px 0 12px 110px;font-weight:700;color:#8a99a1;font-size:12px;letter-spacing:.6px}
.tl-item{display:grid;grid-template-columns:72px 30px minmax(0,1fr);align-items:start;margin-bottom:16px}
.tl-date{text-align:right;padding-top:14px}.tl-date b{display:block;font-size:24px;line-height:1;letter-spacing:-.5px}.tl-date span{font-size:12px;color:var(--mute)}.tl-date small{display:block;color:var(--mute);font-size:11px;margin-top:2px}
.tl-dot{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--rose);margin:20px auto 0;position:relative;z-index:1}
.tl-dot.no{border-color:#c9d3d8}
.tl-card{padding:16px 18px}
.tl-card h4{margin:0;font-size:15.5px;letter-spacing:-.2px}
.tl-body{display:grid;grid-template-columns:190px minmax(0,1fr);gap:20px}
.tl-face{cursor:pointer}.tl-face svg.face{border:1px solid var(--line);border-radius:12px;background:#fff}
.tl-sig{display:flex;flex-direction:column;align-items:center}.tl-sig svg{width:120px;height:36px;border-bottom:1px dotted #9aa8b0}.tl-sig small{font-size:10.5px;color:var(--mute)}
@media (max-width:900px){.tl-body{grid-template-columns:1fr}}
.demo-pill{background:var(--warn-l);color:var(--warn);font-size:11.5px;font-weight:700;border-radius:99px;padding:4px 11px;white-space:nowrap}
@media (max-width:1180px){.demo-pill{display:none}}
/* POS */
.pos{display:grid;grid-template-columns:1fr 400px;gap:18px;align-items:start}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.item{border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;background:#fff;transition:.12s;display:flex;flex-direction:column;gap:6px;min-height:104px}
.item:hover{border-color:var(--rose);transform:translateY(-1px);box-shadow:var(--sh)}
.item .n{font-weight:600;line-height:1.35;flex:1}
.item .pr{font-weight:700;color:var(--rose-d)}
.item.dis{opacity:.45;pointer-events:none}
.cart{position:sticky;top:84px}
.cline{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px}
.qty button{border:none;background:none;width:26px;height:26px;cursor:pointer}
.qty span{width:22px;text-align:center;font-size:13px}
.sumrow{display:flex;justify-content:space-between;padding:4px 0}
.total{font-size:26px;font-weight:800;color:var(--plum);letter-spacing:-.5px}
.methods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.methods button{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 4px;cursor:pointer;font-size:13px;font-weight:500}
.methods button.on{border-color:var(--rose);background:var(--rose-l);color:var(--rose-d);font-weight:700}
.credit-box{background:var(--ok-l);border-radius:11px;padding:10px 12px;font-size:12px;color:#256d4c;margin-top:8px}
.unpaid-strip{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--warn-l);border-radius:14px;padding:10px 14px;margin-bottom:14px;font-size:13px}
.unpaid-strip button{border:1px solid #efd39b;background:#fff;border-radius:99px;padding:4px 12px;cursor:pointer;font-size:12px}
.unpaid-strip button:hover{border-color:var(--warn)}
/* modal */
.mback{position:fixed;inset:0;background:rgba(14,40,52,.38);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:5vh 16px;overflow:auto;backdrop-filter:blur(3px)}
.mback.show{display:flex}
.modal{background:#fff;border-radius:20px;width:100%;max-width:540px;box-shadow:0 24px 70px rgba(14,40,52,.25);animation:pop .16s ease}
.modal.wide{max-width:900px}
.modal.xwide{max-width:1200px}
@keyframes pop{from{transform:translateY(8px);opacity:0}}
.mh{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
.mh h2{margin:0;font-size:17px;font-weight:700}
.mh .x{border:none;background:none;font-size:22px;cursor:pointer;color:var(--mute);line-height:1}
.mb{padding:20px 22px;max-height:74vh;overflow:auto}
.mf{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:14px 22px;border-top:1px solid var(--line);background:#f8fbfc;border-radius:0 0 20px 20px}
.mf .sp{flex:1}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:#6b7c85;font-weight:600}
.form .inp{color:var(--ink);font-size:14px;width:100%;font-weight:400}
.form.f3{grid-template-columns:repeat(3,1fr)} .form.f4{grid-template-columns:repeat(4,1fr)}
.form .s2{grid-column:span 2} .form .s3{grid-column:span 3}
textarea.inp{resize:vertical;min-height:64px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;font-size:14px}
.kv dt{color:var(--mute)} .kv dd{margin:0}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.stat3 div{background:#f5f9fa;border-radius:12px;padding:10px 12px}
.stat3 small{color:var(--mute);font-size:12px} .stat3 b{display:block;font-size:17px;margin-top:2px}
.lbl{font-size:12px;color:#6b7c85;font-weight:600;margin-bottom:6px}
/* toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center}
.t{background:var(--plum);color:#fff;padding:10px 18px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:pop .2s;font-weight:500}
.t.bad{background:var(--bad)} .t.ok{background:var(--ok)}
/* receipt */
.receipt{font-size:13px}
.receipt .rh{text-align:center;margin-bottom:14px}
.receipt .rh .logo{font-size:22px;font-weight:700;color:var(--plum)}
.receipt table td,.receipt table th{padding:6px 4px}
/* login */
body.locked .side,body.locked main{display:none}
#login{display:none;min-height:100vh;width:100%;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 12% 8%,#d6eef2,transparent 40%),radial-gradient(circle at 92% 92%,#dbe8f6,transparent 40%),var(--bg)}
body.locked #login{display:flex}
.lg-card{display:grid;grid-template-columns:1fr 1fr;max-width:920px;width:100%;background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 30px 80px rgba(16,57,74,.15)}
.lg-brand{background:radial-gradient(circle at 85% 18%,rgba(127,211,221,.4),transparent 42%),linear-gradient(155deg,var(--plum2),var(--plum));color:#cde5eb;padding:42px 40px;display:flex;flex-direction:column;justify-content:space-between;gap:30px}
.lg-brand .brand .wm{color:#fff;font-size:24px}.lg-brand .brand .wm small{color:#9fc6cf}
.lg-brand h3{color:#fff;font-size:24px;line-height:1.35;margin:0 0 10px;font-weight:700;letter-spacing:-.3px}
.lg-brand p{line-height:1.7;margin:0}
.lg-form{padding:44px 40px}
.lg-form h2{margin:0 0 4px;font-size:23px;letter-spacing:-.3px}
.lg-form .form{grid-template-columns:1fr;margin-top:22px}
.lg-msg{border-radius:11px;padding:9px 12px;font-size:13px;margin-top:16px}
.lg-msg.bad{background:var(--bad-l);color:var(--bad)} .lg-msg.info{background:var(--info-l);color:var(--info)}
.demo{margin-top:24px;border-top:1px dashed var(--line);padding-top:14px}
.demo button{display:flex;width:100%;justify-content:space-between;align-items:center;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 10px;margin-bottom:6px;cursor:pointer;font-size:12px}
.demo button:hover{border-color:var(--rose);background:#f6fbfc}
/* admin */
.matrix th,.matrix td{text-align:center}
.matrix th:first-child,.matrix td:first-child{text-align:left}
.matrix tr.grp td{background:#f5f9fa;font-weight:700;font-size:12px;color:var(--mute);text-align:left;padding:7px 12px}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--rose);cursor:pointer}
input[type=checkbox]:disabled{cursor:not-allowed}
.theme-pick{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.theme-pick button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:0;cursor:pointer;text-align:left;overflow:hidden}
.theme-pick button.on{border-color:var(--rose)}
.theme-pick .sw{display:flex;height:46px}.theme-pick .sw i{flex:1}
.theme-pick .tx{padding:10px 12px;font-size:13px}.theme-pick .tx b{display:block}
/* OPD / face diagram */
.fx-wrap{display:grid;grid-template-columns:410px 1fr;gap:22px;align-items:start}
.fx-card{border:1px solid var(--line);border-radius:16px;padding:12px;background:#fff;position:sticky;top:0}
.fx-tools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.fx-t{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 11px;font-size:12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;font-weight:500}
.fx-t i{width:10px;height:10px;border-radius:50%;display:inline-block}
.fx-t.on{border-color:var(--plum);background:var(--plum);color:#fff}
.fx-opts{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mute);min-height:34px;flex-wrap:wrap;margin-bottom:6px}
.swatch{width:20px;height:20px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #ccc;cursor:pointer;padding:0}
.swatch.on{box-shadow:0 0 0 2px var(--plum)}
svg.face{width:100%;height:auto;display:block;user-select:none}
svg.face.ed{cursor:crosshair;background:#fcfeff;border-radius:12px;touch-action:none;border:1px dashed var(--line)}
svg.thumb{width:52px;height:auto;flex:none;border:1px solid var(--line);border-radius:9px;background:#fff}
.fx-sum{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip .dot,i.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.sig{border:1px dashed #c9d6db;border-radius:12px;background:#fcfeff;touch-action:none;width:100%;height:auto;display:block;cursor:crosshair}
.sig-wrap{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.svc-pick{display:flex;flex-wrap:wrap;gap:6px}
.form .svc-pick label{display:inline-flex;flex-direction:row;gap:6px;align-items:center;border:1px solid var(--line);border-radius:99px;padding:4px 11px;font-size:12px;cursor:pointer;color:var(--ink);font-weight:500}
.form .svc-pick label:has(input:checked){border-color:var(--rose);background:var(--rose-l)}
.mat th,.mat td{padding:7px 6px;font-size:13px}
.mat .inp{padding:5px 8px;font-size:13px}
.bom-row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.bom-row select{flex:1}.bom-row input{width:90px}.bom-row .u{width:44px}
/* print: OPD card */
#printArea{display:none}
.opd-page{width:279mm;height:190mm;font-family:'IBM Plex Sans Thai',sans-serif;color:#1f1f1f;page-break-after:always;display:flex;flex-direction:column;font-size:10pt;overflow:hidden}
.opd-page:last-child{page-break-after:auto}
.opd-top{display:flex;gap:5mm;align-items:flex-start}
.opd-cbox{border:1.3px solid #444;border-radius:4mm;overflow:hidden;width:80mm;flex:none;text-align:center}
.opd-cbox .n{background:#3a3a3a;color:#fff;font-weight:700;font-size:15pt;padding:2.2mm 2mm;letter-spacing:.2px}
.opd-cbox .a{font-size:7.6pt;padding:1.6mm;line-height:1.45}
.opd-title{font-size:21pt;font-weight:600;flex:1;text-align:center;margin-top:1mm}
.opd-meta{width:92mm;display:flex;gap:3mm;margin-top:2mm}
.opd-row{display:flex;gap:4mm;margin-top:1.8mm;align-items:flex-end}
.opd-f{display:flex;align-items:flex-end;gap:1.5mm;min-width:0}
.opd-f .lb{white-space:nowrap;font-weight:600;line-height:1.05;font-size:10.5pt}
.opd-f .lb small{display:block;font-weight:400;font-size:7pt;color:#555}
.opd-f .v{flex:1;border-bottom:1.2px dotted #444;min-height:5mm;padding:0 1mm;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10pt}
.opd-visits{display:grid;grid-template-columns:1fr 1fr;border-top:1.5px solid #222;margin-top:3mm;flex:1;min-height:0}
.opd-visit{padding:2.5mm 4mm 0;display:flex;flex-direction:column;min-height:0}
.opd-visit+.opd-visit{border-left:1.5px solid #222}
.opd-face{display:flex;justify-content:center}
.opd-face svg{height:72mm;width:auto}
.opd-visit .det{font-size:7.8pt;line-height:1.4}
.opd-visit .sg{margin-top:auto;display:flex;align-items:flex-end;gap:2mm;padding-bottom:1mm;font-size:11pt}
.opd-visit .sgl{display:inline-block;width:48mm;height:12mm;border-bottom:1.2px dotted #444}
.opd-visit .sgl svg{height:12mm;width:48mm}
@media print{
  body{display:block!important;background:#fff}
  body.print-mode > *:not(#printArea){display:none!important}

<script>
/* ================= Utilities ================= */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n || 0).toLocaleString('th-TH', {maximumFractionDigits: 0});
const baht = n => '฿' + fmt(n);
const short = v => v >= 1e6 ? (v/1e6).toFixed(1)+'M' : v >= 1000 ? Math.round(v/1000)+'k' : String(Math.round(v));
const z = n => String(n).padStart(2, '0');
const ds = d => `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;
const today = () => ds(new Date());
const addDays = (s, n) => { const d = new Date(s + 'T00:00'); d.setDate(d.getDate() + n); return ds(d); };
const thDate = (s, o = {day:'numeric', month:'short', year:'2-digit'}) => s ? new Date(s + 'T00:00').toLocaleDateString('th-TH', o) : '-';
const thLong = s => new Date(s + 'T00:00').toLocaleDateString('th-TH', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
const toMin = t => { const [h, m] = t.split(':').map(Number); return h*60 + m; };
const toHM = m => `${z(Math.floor(m/60))}:${z(m%60)}`;
const nowHM = () => { const d = new Date(); return `${z(d.getHours())}:${z(d.getMinutes())}`; };
const monthOf = s => s.slice(0, 7);
const age = dob => { if (!dob) return ''; const d = new Date(dob), n = new Date(); let a = n.getFullYear() - d.getFullYear(); if (n < new Date(n.getFullYear(), d.getMonth(), d.getDate())) a--; return a; };

function toast(msg, type = '') {
  const el = document.createElement('div'); el.className = 't ' + type; el.textContent = msg;
  $('#toast').appendChild(el); setTimeout(() => el.remove(), 2600);
}

/* ================= Constants ================= */
const CATS = ['Injection', 'Laser', 'Facial', 'Body'];

const DAY_START = 600, DAY_END = 1200, SH = 30; // 10:00–20:00, 30px per 30 min

/* ================= Data store ================= */
const DB_KEY = 'mounta_clinic_demo_v1';
let db;
function save() { localStorage.setItem(DB_KEY, JSON.stringify(db)); }
async function load() {
  try { db = JSON.parse(localStorage.getItem(DB_KEY)); } catch { db = null; }
  if (!db || !db.customers) db = seed();
  await ensureAuthData(); migrate(); save();
}
function resetDemo() {
  if (!can('data.reset')) return deny();
  confirmBox('รีเซ็ตข้อมูลตัวอย่าง', 'ข้อมูลลูกค้า นัดหมาย การขาย และสต็อกจะถูกแทนที่ด้วยข้อมูลตัวอย่างชุดใหม่ (บัญชีผู้ใช้และสิทธิ์ยังคงเดิม) ต้องการดำเนินการต่อหรือไม่?', () => {
    const keep = {users:db.users, rolePerms:db.rolePerms, audit:db.audit, settings:db.settings, permsVersion:db.permsVersion};
    db = {...seed(), ...keep}; audit('รีเซ็ตข้อมูลตัวอย่าง'); save(); closeModal(); route(); toast('รีเซ็ตข้อมูลแล้ว', 'ok');
  }, 'รีเซ็ต');
}

/* ================= Auth & permissions ================= */
const PERM_GROUPS = [
  ['นัดหมาย', [['appt.view','ดูตารางนัดหมาย'], ['appt.edit','สร้าง / แก้ไข / ยกเลิกนัด'], ['appt.status','เช็คอิน / ปิดเคส / ตัดคอร์ส']]],

  ['การรักษา (OPD)', [['opd.view','ดูบันทึกการรักษา แผนภาพใบหน้า และพิมพ์ใบประวัติ'], ['opd.write','บันทึกการรักษา / มาร์กแผนภาพ / ลงนาม']]],
  ['การเงิน', [['pos.sell','ขายและรับชำระเงิน'], ['pos.discount','ให้ส่วนลดในบิล'], ['revenue.view','ดูรายได้บนหน้าภาพรวม'], ['reports.view','ดูรายงานและส่งออกข้อมูล']]],
  ['บริการ & คลัง', [['catalog.view','ดูรายการบริการ คอร์ส และราคา'], ['catalog.edit','เพิ่ม / แก้ไข / ลบ บริการ คอร์ส สินค้า และราคา'], ['stock.view','ดูคลังสินค้า'], ['stock.in','รับสินค้าเข้าคลัง'], ['stock.adjust','ปรับลดสต็อก (หมดอายุ / เสียหาย)'], ['stock.cost','ดูต้นทุนและมูลค่าสต็อก']]],
  ['พนักงาน & ระบบ', [['staff.view','ดูยอดเคสและค่าคอมของตัวเอง'], ['staff.all','ดูยอดและค่าคอมของพนักงานทุกคน'], ['users.manage','จัดการผู้ใช้ สิทธิ์ และข้อมูลพนักงาน'], ['data.reset','รีเซ็ตข้อมูลระบบ']]],
];
const ALL_PERMS = PERM_GROUPS.flatMap(g => g[1].map(p => p[0]));
const ROLE_DEF = {admin:'ผู้จัดการ / เจ้าของ', doctor:'แพทย์', therapist:'Therapist', reception:'แคชเชียร์ / ต้อนรับ'};
const DEFAULT_ROLE_PERMS = {
  admin: ALL_PERMS,

  therapist: ['appt.view','appt.status','cust.view','opd.view','opd.write','catalog.view','stock.view','staff.view'],
  reception: ['appt.view','appt.edit','appt.status','cust.view','cust.edit','cust.spend','pos.sell','pos.discount','catalog.view','stock.view','stock.in'],
};
const PAGE_PERM = {dashboard:null, customer:'cust.view', history:'cust.view', appointments:'appt.view', customers:'cust.view', pos:'pos.sell', services:'catalog.view', inventory:'stock.view', staff:'staff.view', reports:'reports.view', users:'users.manage'};
// Demo accounts for the prototype only — remove before real use.
const DEMO_USERS = [
  {id:'u1', username:'admin', name:'ผู้จัดการคลินิก', role:'admin', staffId:'', pw:'admin1234'},
  {id:'u2', username:'dr.nicha', name:'พญ.ณิชา วงศ์สวัสดิ์', role:'doctor', staffId:'s1', pw:'esteem1234'},
  {id:'u3', username:'dr.theerapat', name:'นพ.ธีรภัทร์ อินทร์แก้ว', role:'doctor', staffId:'s2', pw:'esteem1234'},
  {id:'u4', username:'mook', name:'คุณมุก ศรีวงศ์', role:'therapist', staffId:'s3', pw:'esteem1234'},
  {id:'u5', username:'praew', name:'คุณแพรว จันทร์หอม', role:'therapist', staffId:'s4', pw:'esteem1234'},
  {id:'u6', username:'beam', name:'คุณบีม ทองคำ', role:'reception', staffId:'s5', pw:'esteem1234'},
];
const SESS_KEY = 'mounta_demo_session', IDLE_MS = 30 * 60 * 1000;
let me = null, loginFails = 0, lockUntil = 0;
const can = p => !!me && (me.role === 'admin' || (db.rolePerms[me.role] || []).includes(p));
const canPage = k => !!me && (!PAGE_PERM[k] || can(PAGE_PERM[k]));
const deny = () => toast('คุณไม่มีสิทธิ์ทำรายการนี้', 'bad');

async function hashPw(pw, salt) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + pw));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}
async function setPassword(u, pw) { u.salt = uid() + uid(); u.hash = await hashPw(pw, u.salt); delete u.pw; }
async function ensureAuthData() {
  if (!db.users) db.users = DEMO_USERS.map(u => ({...u, active:true, lastLogin:''}));
  if (!db.rolePerms) db.rolePerms = JSON.parse(JSON.stringify(DEFAULT_ROLE_PERMS));
  if (!db.audit) db.audit = [];
  for (const u of db.users) if (u.pw) await setPassword(u, u.pw);
}
function audit(action, detail = '') {
  db.audit.push({at:new Date().toISOString(), user:me ? me.username : '-', action, detail});
  if (db.audit.length > 500) db.audit = db.audit.slice(-500);
  save();
}

}

function takeStock(p, qty, type, note, ref, lotId, onlyLot = false) {
  let left = round2(qty); const used = [];
  let lots = p.lots.filter(l => l.qty > 0 && (l.id === lotId || (!onlyLot && expState(l.exp) !== 'expired'))).sort(lotSort);

      note: '', createdAt: addDays(T, -ri(95, 500)), idCard: '',

  // new customers this month
  for (let i = 0; i < 4; i++) customers[i].createdAt = addDays(T, -ri(0, 5));

  const doctors = ['s1','s2'], thera = ['s3','s4'];
  const isDocSvc = s => s.cat === 'Injection' || (s.cat === 'Laser' && s.id !== 'sv8');
  let seq = 0;
  for (let d = -120; d <= 0; d++) {

    sv2: () => mirror([[150,398],[182,402]]).map(p => jit(p, 'filler', 0.25)),
    sv3: () => mirror([[150,430],[108,440],[200,470],[130,500],[170,560]]).map(p => jit(p, 'booster', 0)),
    sv4: () => mirror([140,170,200].flatMap(x => [425,455,485].map(y => [x, y]))).map(p => jit(p, 'booster', 0)),
  };
  const ellp = (cx, cy, rx, ry) => { const pts = []; for (let i = 0; i < 20; i++) { const a = i / 20 * Math.PI * 2; pts.push([Math.round(cx + Math.cos(a) * rx * (.92 + R() * .16)), Math.round(cy + Math.sin(a) * ry * (.92 + R() * .16))]); } pts.push(pts[0]); return pts; };
  const mir = pts => pts.map(([x, y]) => [526 - x, y]);
  const jaw = [[98,470],[110,530],[140,590],[190,635],[262,655]], chk = [[118,430],[150,470],[175,520]];
  const STK = {
    sv5: () => { const l = ellp(160, 452, 40, 26); return [{c:'#d23c3c', w:2.5, pts:l}, {c:'#d23c3c', w:2.5, pts:mir(l)}]; },
    sv6: () => [jaw, mir(jaw), chk, mir(chk)].map(pts => ({c:'#2f5fd0', w:2.5, pts})),

  const TXT = {
    Injection:[['ริ้วรอยหน้าผากและหางตา','ต้องการหน้าดูสดใส อ่อนเยาว์','ใต้ตาลึก ดูเหนื่อย','ผิวแห้ง ขาดความชุ่มชื้น','ติดตามผลและทำต่อเนื่อง'],['ทำหัตถการเรียบร้อย ไม่มีภาวะแทรกซ้อน แนะนำงดนวดหน้า 2 สัปดาห์','ประคบเย็น 10 นาที ลูกค้าพึงพอใจ นัดติดตามผล 2 สัปดาห์','มีรอยช้ำเล็กน้อย แนะนำทาครีมลดรอยช้ำ','ทาครีมยาชา 30 นาทีก่อนทำ ลูกค้าทนได้ดี']],

  usages.slice().sort((a, b) => a.date.localeCompare(b.date)).forEach(u => {

}

// Recolour the logo to the active theme (dark → --rose-d, mid → --rose, light → --accent); whites stay white.
let LOGO_TINT = LOGO_IMG;
function tintLogo() {
  const cs = getComputedStyle(document.documentElement), hex = n => { const h = cs.getPropertyValue('--' + n).trim().replace('#', ''); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); };
  const st = [hex('rose-d'), hex('rose'), hex('accent')];
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
    const x = c.getContext('2d'); x.drawImage(img, 0, 0);
    const d = x.getImageData(0, 0, c.width, c.height), p = d.data, L = [];
    const col = i => p[i + 3] > 0 && Math.max(p[i], p[i + 1], p[i + 2]) - Math.min(p[i], p[i + 1], p[i + 2]) > 25;
    for (let i = 0; i < p.length; i += 4) if (col(i)) L.push(.299 * p[i] + .587 * p[i + 1] + .114 * p[i + 2]);
    L.sort((a, b) => a - b); const lo = L[Math.floor(L.length * .02)] || 0, hi = L[Math.floor(L.length * .98)] || 255;
    const mix = (a, b, t) => a.map((v, k) => Math.round(v + (b[k] - v) * t));
    for (let i = 0; i < p.length; i += 4) {
      if (!col(i)) continue;
      const t = Math.min(1, Math.max(0, (.299 * p[i] + .587 * p[i + 1] + .114 * p[i + 2] - lo) / ((hi - lo) || 1)));
      const rgb = t < .5 ? mix(st[0], st[1], t * 2) : mix(st[1], st[2], (t - .5) * 2);
      p[i] = rgb[0]; p[i + 1] = rgb[1]; p[i + 2] = rgb[2];

function buildVisits(id) {

  const courses = `<div class="card"><h3>คอร์สของลูกค้า <small>${crs.length} คอร์ส</small></h3>${crs.slice(0, 6).map(x => { const co = courseOf(x.courseId), l = x.total - x.used; return `<div class="list-row"><div class="grow"><b class="ell" style="display:block">${esc(co?.name || '-')}</b><span class="small muted">ใช้ ${x.used}/${x.total} · ซื้อ ${thDate(x.date)}</span></div><div class="prog" style="width:90px"><i style="width:${x.used / x.total * 100}%;${l ? '' : 'background:#c9d3d8'}"></i></div><b style="width:54px;text-align:right;color:${l ? 'var(--ok)' : 'var(--mute)'}">${l ? 'เหลือ ' + l : 'ครบ'}</b></div>`; }).join('') || '<div class="empty">ยังไม่มีคอร์ส</div>'}</div>`;

const FACE_PATHS = `<image href="${FACE_IMG}" x="0" y="0" width="${FACE_W}" height="${FACE_H}"/>`;
const faceSVG = (inner = '', cls = 'face', attrs = '') => `<svg viewBox="${FACE_VB}" class="${cls}" ${attrs}>${FACE_PATHS}<g class="fx-layer">${inner}</g></svg>`;
const pathD = pts => pts.length === 1 ? `M${pts[0][0]} ${pts[0][1]} l0.1 0` : 'M' + pts.map(p => p.join(' ')).join(' L');
const strokesSVG = (strokes, k = 1) => (strokes || []).map(s => `<path d="${pathD(s.pts)}" fill="none" stroke="${s.c}" stroke-width="${(s.w || 2.5) * k}" stroke-linecap="round" stroke-linejoin="round"/>`).join('');
function markSVG(m, label) {
  const c = (MARK_TYPES[m.t] || MARK_TYPES.mark).color, x = m.x, y = m.y;
  const k = MK, w = 1.4 * k;
  const s = m.t === 'botox' ? `<circle cx="${x}" cy="${y}" r="${5 * k}" fill="${c}" stroke="#fff" stroke-width="${w}"/>`
    : m.t === 'filler' ? `<path d="M${x} ${y - 7 * k}L${x + 6 * k} ${y}L${x} ${y + 7 * k}L${x - 6 * k} ${y}Z" fill="${c}" stroke="#fff" stroke-width="${w}"/>`
    : m.t === 'booster' ? `<rect x="${x - 4.5 * k}" y="${y - 4.5 * k}" width="${9 * k}" height="${9 * k}" fill="${c}" stroke="#fff" stroke-width="${w}"/>`
    : m.t === 'thread' ? `<path d="M${x} ${y - 6 * k}L${x + 6 * k} ${y + 5 * k}L${x - 6 * k} ${y + 5 * k}Z" fill="${c}" stroke="#fff" stroke-width="${w}"/>`
    : `<path d="M${x - 5 * k} ${y - 5 * k}L${x + 5 * k} ${y + 5 * k}M${x + 5 * k} ${y - 5 * k}L${x - 5 * k} ${y + 5 * k}" stroke="${c}" stroke-width="${2.6 * k}" stroke-linecap="round"/>`;
  return s + (label !== '' ? `<text x="${x + 7 * k}" y="${y - 5 * k}" font-size="${10 * k}" font-weight="700" fill="${c}" paint-order="stroke" stroke="#fff" stroke-width="${3 * k}">${esc(label)}</text>` : '');
}
function overlay(marks = [], strokes = []) { let n = 0; return strokesSVG(strokes, MK) + marks.map(m => markSVG(m, m.t === 'mark' ? (m.note || ++n) : m.v ? fmtNum(m.v) : '')).join(''); }
function markTotals(marks = []) { const o = {}; marks.forEach(m => { const x = o[m.t] ||= {n:0, v:0}; x.n++; x.v = round2(x.v + (Number(m.v) || 0)); }); return o; }
const totLabel = (k, x) => { const m = MARK_TYPES[k]; return `${m.label} ${x.n} จุด${m.unit && m.unit !== 'จุด' && x.v ? ` รวม ${fmtNum(x.v)} ${m.unit}` : ''}`; };
const totalsText = marks => Object.entries(markTotals(marks)).map(([k, x]) => totLabel(k, x)).join(' · ');
const sumChips = (marks, empty = '') => Object.entries(markTotals(marks)).map(([k, x]) => `<span class="chip mute"><i class="dot" style="background:${MARK_TYPES[k].color}"></i>${totLabel(k, x)}</span>`).join('') || empty;

/* ---- editor ---- */
let fx = null;
function svgPt(e, svg) { const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const r = pt.matrixTransform(svg.getScreenCTM().inverse()); return {x:Math.round(r.x), y:Math.round(r.y)}; }
function pushUndo() { fx.undo.push(JSON.stringify({marks:fx.marks, strokes:fx.strokes})); if (fx.undo.length > 60) fx.undo.shift(); }
function padDown(e) {
  if (!fx) return;
  const svg = e.currentTarget, pad = svg.dataset.pad, p = svgPt(e, svg);
  try { svg.setPointerCapture(e.pointerId); } catch {} e.preventDefault();
  if (pad !== 'face') { fx[pad].push({c:'#1d1d3a', w:2.2, pts:[[p.x, p.y]]}); fx.cur = fx[pad].at(-1); fx.curPad = pad; return renderPad(pad); }
  pushUndo();
  if (fx.tool === 'pen') { fx.strokes.push({c:fx.color, w:2.5, pts:[[p.x, p.y]]}); fx.cur = fx.strokes.at(-1); fx.curPad = 'face'; }
  else if (fx.tool === 'erase') eraseAt(p);
  else fx.marks.push({t:fx.tool, x:p.x, y:p.y, v:Number(fx.amt[fx.tool]) || 0, ...(fx.tool === 'mark' && fx.note.trim() ? {note:fx.note.trim()} : {})});
  renderPad('face'); renderTools();
}
function padMove(e) {
  if (!fx?.cur) return;
  const p = svgPt(e, e.currentTarget), l = fx.cur.pts.at(-1);
  if (Math.hypot(p.x - l[0], p.y - l[1]) < (fx.curPad === 'face' ? 3 : 2)) return;
  fx.cur.pts.push([p.x, p.y]); renderPad(fx.curPad);
}
function padUp() { if (fx) fx.cur = null; }
function eraseAt(p) {
  let i = fx.marks.findIndex(m => Math.hypot(m.x - p.x, m.y - p.y) < 10 * MK);
  if (i >= 0) return fx.marks.splice(i, 1);
  i = fx.strokes.findIndex(s => s.pts.some(q => Math.hypot(q[0] - p.x, q[1] - p.y) < 8 * MK));
  if (i >= 0) fx.strokes.splice(i, 1);
}
function fxUndo() { const s = fx.undo.pop(); if (!s) return; Object.assign(fx, JSON.parse(s)); renderPad('face'); renderTools(); }
function fxClear() { if (!fx.marks.length && !fx.strokes.length) return; pushUndo(); fx.marks = []; fx.strokes = []; renderPad('face'); renderTools(); }
function renderPad(k) {
  if (k === 'face') { $('#faceEd .fx-layer').innerHTML = overlay(fx.marks, fx.strokes); $('#fxSum').innerHTML = sumChips(fx.marks, '<span class="small muted">เลือกเครื่องมือ แล้วคลิก/แตะบนใบหน้าเพื่อมาร์กตำแหน่ง</span>'); }
  else $('#' + k + 'L').innerHTML = strokesSVG(fx[k]);
}
function renderTools() {
  const t = fx.tool, mt = MARK_TYPES[t];
  $('#fxTools').innerHTML = `<div class="fx-tools">${Object.entries(MARK_TYPES).map(([k, m]) => `<button type="button" class="fx-t ${t === k ? 'on' : ''}" onclick="fx.tool='${k}';renderTools()"><i style="background:${m.color}"></i>${m.label}</button>`).join('')}
    <button type="button" class="fx-t ${t === 'pen' ? 'on' : ''}" onclick="fx.tool='pen';renderTools()">✎ วาดเส้น / พื้นที่</button><button type="button" class="fx-t ${t === 'erase' ? 'on' : ''}" onclick="fx.tool='erase';renderTools()">⌫ ลบ</button></div>
    <div class="fx-opts">${mt && mt.step ? `ปริมาณต่อจุด <input class="inp" type="number" min="0" step="${mt.step}" style="width:76px;padding:4px 8px" value="${fx.amt[t]}" onchange="fx.amt['${t}']=Number(this.value)||0"> ${mt.unit}` : ''}
    ${t === 'mark' ? `ข้อความ <input class="inp" style="width:130px;padding:4px 8px" placeholder="เช่น สิว, ฝ้า" value="${esc(fx.note)}" oninput="fx.note=this.value">` : ''}
    ${t === 'pen' ? ['#d23c3c', '#2f5fd0', '#222222', '#1f9d6b'].map(c => `<button type="button" title="สี" onclick="fx.color='${c}';renderTools()" class="swatch ${fx.color === c ? 'on' : ''}" style="background:${c}"></button>`).join('') : ''}
    ${t === 'erase' ? 'คลิกที่จุดหรือเส้นที่ต้องการลบ' : ''}
    <span style="flex:1"></span><button type="button" class="btn sm" onclick="fxUndo()" ${fx.undo.length ? '' : 'disabled'}>↶ ย้อนกลับ</button><button type="button" class="btn sm ghost" onclick="fxClear()">ล้าง</button></div>`;
}
const sigPad = (k, label) => `<div><div class="lbl" style="display:flex;justify-content:space-between">${label}<a href="javascript:void 0" onclick="fx.${k}=[];renderPad('${k}')">ล้าง</a></div><svg viewBox="0 0 300 90" class="sig" data-pad="${k}" onpointerdown="padDown(event)" onpointermove="padMove(event)" onpointerup="padUp()" onpointercancel="padUp()"><line x1="20" y1="72" x2="280" y2="72" stroke="#e3d8dc" stroke-dasharray="4 4"/><g id="${k}L"></g></svg></div>`;
const sigView = (strokes, label, sub = '') => `<div><div class="lbl">${label}</div><svg viewBox="0 0 300 90" class="sig" style="cursor:default"><line x1="20" y1="72" x2="280" y2="72" stroke="#e3d8dc" stroke-dasharray="4 4"/>${strokesSVG(strokes)}</svg>${sub ? `<div class="small muted">${sub}</div>` : ''}</div>`;

function openTreatmentForm({customerId, apptId, date, serviceIds, retro, usageId} = {}) {
  if (!can('opd.write')) return deny();
  const a = apptId ? byId('appointments', apptId) : null;
  if (a?.treatmentId) return openTreatment(a.treatmentId);
  customerId ||= a?.customerId;
  const c = byId('customers', customerId); if (!c) return;
  const last = db.treatments.filter(t => t.customerId === customerId).sort((x, y) => (y.date + y.time).localeCompare(x.date + x.time))[0];
  const prov = db.staff.filter(s => ['แพทย์', 'Therapist', 'พยาบาล'].includes(s.role));

function saveTreatment() {

  mats.forEach(m => { const p = byId('products', m.productId), cost = p.cost;
    if (fx.retro) { const l = p.lots.find(x => x.id === m.lotId); t.materials.push({productId:p.id, name:p.name, unit:p.unit, qty:m.qty, lots:l ? [{lot:l.lot, exp:l.exp, qty:m.qty}] : [], cost}); return; }
    const r = takeStock(p, m.qty, 'use', `${t.no} · ${c.hn}`, t.id, m.lotId); t.materials.push({productId:p.id, name:p.name, unit:p.unit, qty:m.qty, lots:r.used, cost}); });
  db.treatments.push(t);
  if (fx.retro) {
    t.retro = true; t.time = ''; const u = byId('usages', fx.usageId); if (u) { u.txId = t.id; t.staffId = t.staffId || u.staffId; }
    audit('บันทึก OPD ย้อนหลัง', `${t.no} · ${c.hn} ${c.name} · ${serviceIds.map(svcName).join(', ')} (${thDate(t.date)})`);

  }
  let a = fx.apptId ? byId('appointments', fx.apptId) : null;
  if (!a) {
    const nm = Math.min(DAY_END - 30, Math.max(DAY_START, Math.floor(toMin(nowHM()) / 30) * 30));
    a = {id:uid(), date:f.date, time:toHM(nm), duration:30, customerId:fx.customerId, staffId:f.staffId, serviceId:serviceIds[0], status:'arrived', note:'Walk-in (สร้างจากบันทึกการรักษา)', createdBy:me.username};
    db.appointments.push(a); t.apptId = a.id;
  }
  a.treatmentId = t.id; a.serviceIds = serviceIds; if (a.status === 'booked') a.status = 'arrived';
  audit('บันทึกการรักษา', `${t.no} · ${c.hn} ${c.name} · ${serviceIds.map(svcName).join(', ')} · วัสดุ ${t.materials.length} รายการ`);
  save(); fx = null; closeModal(); route();
  toast(`บันทึก ${t.no} และตัดสต็อกวัสดุแล้ว`, 'ok');
  if (a.status !== 'done' && can('appt.status')) completeAppt(a.id);

function addItem(type, id) {

function chQty(i, d) {

function renderCart() {

      <div class="sumrow" style="margin-top:8px;align-items:baseline"><b>ยอดชำระ</b><span class="total">${baht(total)}</span></div>
    </div>
    <div class="methods">${METHODS.map(m => `<button class="${pos.method === m ? 'on' : ''}" onclick="pos.method='${m}';renderCart()">${m}</button>`).join('')}</div>
    <div style="display:flex;gap:8px"><button class="btn" onclick="pos=newPos();viewPOS()">ล้าง</button><button class="btn p" style="flex:1;justify-content:center;padding:12px" onclick="checkout()" ${pos.items.length ? '' : 'disabled'}>ชำระเงิน ${baht(total)}</button></div>`;
}
function checkout() {
  if (!can('pos.sell')) return deny();
  if (!can('pos.discount')) pos.discount = 0;
  if (!pos.items.length) return toast('ยังไม่มีรายการ', 'bad');
  if (!pos.customerId) return toast('กรุณาเลือกลูกค้า', 'bad');
  for (const it of pos.items) if (it.type === 'product') { const p = byId('products', it.refId); if (availQty(p) < it.qty) return toast(`${p.name} สต็อกไม่พอ`, 'bad'); }
  const T = today(), sub = pos.items.reduce((a, b) => a + b.price * b.qty, 0);
  const n = db.invoices.filter(i => i.date === T).length + 1;
  const inv = {id:uid(), no:`INV${T.replace(/-/g, '').slice(2)}-${z(n)}`, date:T, time:nowHM(), customerId:pos.customerId, staffId:pos.staffId, items:pos.items.map(x => ({...x})), discount:pos.discount, total:sub - pos.discount, method:pos.method, cashier:me.username};
  db.invoices.push(inv);
  inv.items.forEach(it => {
    if (it.type === 'product') takeStock(byId('products', it.refId), it.qty, 'sale', inv.no, inv.id);
    if (it.type === 'course') { const c = courseOf(it.refId); for (let q = 0; q < it.qty; q++) db.credits.push({id:uid(), customerId:inv.customerId, courseId:c.id, total:c.sessions, used:0, date:T, invoiceId:inv.id}); }
    if (it.type === 'service') for (let q = 0; q < it.qty; q++) db.usages.push({id:uid(), date:T, customerId:inv.customerId, serviceId:it.refId, staffId:inv.staffId, source:'paid'});
  });
  const ap = pos.apptId ? byId('appointments', pos.apptId) : null, apSvc = ap ? (ap.serviceIds || [ap.serviceId]) : [], skip = ap && (ap.treatmentId || ap.bomDone);
  const bomIds = inv.items.filter(it => it.type === 'service').flatMap(it => Array(it.qty).fill(it.refId)).filter(id => !(skip && apSvc.includes(id)));
  if (bomIds.length) deductBOM(bomIds, `${inv.no} · ${byId('customers', inv.customerId)?.hn}`, inv.id);
  if (ap) { ap.status = 'done'; delete ap.unpaid; if (!ap.treatmentId) ap.bomDone = true; }
  audit('รับชำระเงิน', `${inv.no} · ${custName(inv.customerId)} · ${baht(inv.total)}${inv.discount ? ` (ส่วนลด ${baht(inv.discount)})` : ''} · ${inv.method}`);
  save(); pos = newPos(); viewPOS(); showReceipt(inv.id); toast('ชำระเงินเรียบร้อย', 'ok');
}

function delItem(col, id) {

/* ================= Inventory ================= */
let invTab = 'supply', invQ = '', logType = '';
const LOG_TYPE = {in:['รับเข้า', 'ok'], sale:['ขาย', 'info'], use:['ใช้ในหัตถการ', 'mute'], adjust:['ปรับลด', 'bad']};
const ADJ_REASONS = ['หมดอายุ', 'ชำรุด / ปนเปื้อน', 'ใช้ภายในคลินิก', 'นับสต็อกไม่ตรง', 'อื่นๆ'];
function viewInventory() {
  const ce = can('catalog.edit'), sc = can('stock.cost');
  $('#topActions').innerHTML = ce ? `<button class="btn p" onclick="openProdForm({kind:'${invTab === 'retail' ? 'retail' : 'supply'}'})">+ เพิ่มรายการ</button>` : '';
  const low = db.products.filter(p => p.stock <= p.min).length;
  const expLots = db.products.flatMap(p => p.lots.filter(l => l.qty > 0 && expState(l.exp)));
  const kpis = [`<div class="card kpi"><div class="l">ยา / วัสดุหัตถการ</div><div class="v">${db.products.filter(p => p.kind === 'supply').length}</div><div class="d">สินค้าขายหน้าร้าน ${db.products.filter(p => p.kind === 'retail').length} รายการ</div></div>`];
  if (sc) kpis.push(`<div class="card kpi"><div class="l">มูลค่าสต็อก (ทุน)</div><div class="v">${baht(db.products.reduce((a, p) => a + p.stock * p.cost, 0))}</div></div>`);
  kpis.push(`<div class="card kpi"><div class="l">ต่ำกว่าจุดสั่งซื้อ</div><div class="v" style="color:${low ? 'var(--bad)' : 'inherit'}">${low}</div><div class="d">รายการ</div></div>`,
    `<div class="card kpi"><div class="l">ล็อตหมดอายุ / ใกล้หมด (60 วัน)</div><div class="v" style="color:${expLots.length ? 'var(--warn)' : 'inherit'}">${expLots.length}</div><div class="d">ระบบใช้ล็อตที่หมดอายุก่อนเสมอ (FEFO)</div></div>`);
  $('#view').innerHTML = `<div class="grid ${kpis.length === 4 ? 'g4' : 'g3'}" style="margin-bottom:18px">${kpis.join('')}</div>
    <div class="toolbar"><div class="tabs">${[['supply', 'ยา / วัสดุหัตถการ'], ['retail', 'สินค้าขายหน้าร้าน'], ['log', 'ความเคลื่อนไหว']].map(([k, l]) => `<button class="${invTab === k ? 'on' : ''}" onclick="invTab='${k}';route()">${l}</button>`).join('')}</div>
    ${invTab !== 'log' ? `<input class="inp search" placeholder="ค้นหาชื่อ / SKU" value="${esc(invQ)}" oninput="invQ=this.value;renderInvTable()">` : `<select class="inp" onchange="logType=this.value;renderStockLog()"><option value="">ทุกประเภท</option>${Object.entries(LOG_TYPE).map(([k, [l]]) => opt(k, l, logType)).join('')}</select>`}</div>
    <div class="card" style="padding:6px 8px" id="invBody"></div>`;
  invTab === 'log' ? renderStockLog() : renderInvTable();
}
function renderInvTable() {
  const ce = can('catalog.edit'), sc = can('stock.cost'), si = can('stock.in'), sa = can('stock.adjust'), q = invQ.trim().toLowerCase();
  const rows = db.products.filter(p => p.kind === invTab && (!q || (p.name + ' ' + p.sku).toLowerCase().includes(q)));
  $('#invBody').innerHTML = `<table><thead><tr><th>SKU</th><th>รายการ</th>${sc ? '<th class="num">ทุน/หน่วย</th>' : ''}${invTab === 'retail' ? '<th class="num">ราคาขาย</th>' : '<th>ใช้ใน BOM</th>'}<th>คงเหลือ</th><th>ล็อตถัดไป (FEFO)</th><th></th></tr></thead><tbody>
  ${rows.map(p => {
    const nx = fefoLot(p), es = expState(nx?.exp), used = db.services.filter(s => (s.bom || []).some(b => b.productId === p.id)).length, exAny = p.lots.some(l => l.qty > 0 && expState(l.exp) === 'expired');
    return `<tr class="click" onclick="openLots('${p.id}')"><td class="muted small">${esc(p.sku)}</td><td><b>${esc(p.name)}</b>${p.markType ? ` <span class="chip info" title="ดึงยอดจากแผนภาพใบหน้าได้">${MARK_TYPES[p.markType].label}</span>` : ''}</td>
    ${sc ? `<td class="num muted">${baht2(p.cost)}</td>` : ''}${invTab === 'retail' ? `<td class="num">${baht(p.price)}</td>` : `<td class="small muted">${used ? used + ' หัตถการ' : '-'}</td>`}
    <td style="min-width:150px"><div style="display:flex;justify-content:space-between;gap:6px;font-size:12px"><b>${fmtNum(p.stock)} ${esc(p.unit)}</b>${p.stock <= p.min ? `<span class="chip ${p.stock ? 'warn' : 'bad'}">${p.stock ? 'ใกล้หมด' : 'หมด'}</span>` : ''}</div><div class="prog" style="margin-top:4px"><i style="width:${Math.min(100, p.stock / ((p.min || 1) * 3) * 100)}%;background:${p.stock <= p.min ? 'var(--warn)' : 'var(--ok)'}"></i></div></td>
    <td class="small">${nx ? `${esc(nx.lot)}${nx.exp ? ` <span class="chip ${es === 'near' ? 'warn' : 'mute'}">Exp ${thDate(nx.exp)}</span>` : ''}` : '<span class="muted">-</span>'}${exAny ? ' <span class="chip bad">มีล็อตหมดอายุ</span>' : ''}</td>
    <td class="num" style="white-space:nowrap" onclick="event.stopPropagation()">${si ? `<button class="btn sm" onclick="openStockIn('${p.id}')">+ รับเข้า</button>` : ''} ${sa ? `<button class="btn sm ghost" onclick="openAdjust('${p.id}')">ปรับลด</button>` : ''} ${ce ? `<button class="btn sm ghost" onclick="openProdForm(byId('products','${p.id}'))">แก้ไข</button>` : ''}</td></tr>`;
  }).join('') || '<tr><td colspan="7" class="empty">ไม่พบรายการ</td></tr>'}</tbody></table>`;
}
function renderStockLog() {
  const rows = db.stockLog.filter(l => !logType || l.type === logType).slice().reverse().slice(0, 300);
  $('#invBody').innerHTML = `<table><thead><tr><th>วันที่</th><th>รายการ</th><th>ประเภท</th><th>ล็อต</th><th class="num">จำนวน</th><th>อ้างอิง</th><th>โดย</th></tr></thead><tbody>${rows.map(l => { const p = byId('products', l.productId); return `<tr><td class="small muted" style="white-space:nowrap">${thDate(l.date)}</td><td>${esc(p?.name || '-')}</td><td><span class="chip ${LOG_TYPE[l.type]?.[1] || 'mute'}">${LOG_TYPE[l.type]?.[0] || esc(l.type)}</span></td><td class="small">${esc(l.lot || '-')}</td><td class="num" style="white-space:nowrap;color:${l.qty > 0 ? 'var(--ok)' : 'var(--bad)'}"><b>${l.qty > 0 ? '+' : ''}${fmtNum(l.qty)}</b> <span class="small muted">${esc(p?.unit || '')}</span></td><td class="small muted">${esc(l.note || '')}</td><td class="small">${esc(l.by || '-')}</td></tr>`; }).join('') || '<tr><td colspan="7" class="empty">ไม่มีข้อมูล</td></tr>'}</tbody></table>`;
}
function openLots(id) {
  if (!can('stock.view')) return deny();
  const p = byId('products', id), logs = db.stockLog.filter(l => l.productId === id).slice().reverse().slice(0, 25);
  const bom = db.services.filter(s => (s.bom || []).some(b => b.productId === id));
  openModal({wide:true, title:esc(p.name), body:`<div class="muted" style="margin-bottom:14px">${esc(p.sku)} · ${KIND_TH[p.kind]} · คงเหลือ <b style="color:var(--ink)">${fmtNum(p.stock)} ${esc(p.unit)}</b> (ใช้ได้ ${fmtNum(availQty(p))}) · จุดสั่งซื้อ ${fmtNum(p.min)}${can('stock.cost') ? ` · ทุนเฉลี่ย ${baht2(p.cost)}/${esc(p.unit)}` : ''}</div>
    ${bom.length ? `<div class="small" style="margin-bottom:14px">ใช้ใน BOM: ${bom.map(s => `<span class="chip mute">${esc(s.name)} · ${fmtNum(s.bom.find(b => b.productId === id).qty)} ${esc(p.unit)}</span>`).join(' ')}</div>` : ''}
    <div class="grid g2"><div><div class="lbl">ล็อตคงเหลือ (เรียงตามวันหมดอายุ)</div><table><thead><tr><th>ล็อต</th><th>วันหมดอายุ</th><th class="num">คงเหลือ</th></tr></thead><tbody>${p.lots.slice().sort(lotSort).map(l => { const es = expState(l.exp); return `<tr><td><b>${esc(l.lot)}</b></td><td>${l.exp ? thDate(l.exp) : '-'} ${es ? `<span class="chip ${es === 'expired' ? 'bad' : 'warn'}">${es === 'expired' ? 'หมดอายุ' : 'ใกล้หมดอายุ'}</span>` : ''}</td><td class="num">${fmtNum(l.qty)}</td></tr>`; }).join('') || '<tr><td colspan="3" class="empty">ไม่มีสต็อก</td></tr>'}</tbody></table></div>
    <div><div class="lbl">ความเคลื่อนไหวล่าสุด</div>${logs.map(l => `<div class="list-row"><div class="grow"><div class="small"><span class="chip ${LOG_TYPE[l.type]?.[1] || 'mute'}">${LOG_TYPE[l.type]?.[0] || esc(l.type)}</span> ${esc(l.lot || '')}</div><div class="small muted ell">${thDate(l.date)} · ${esc(l.note || '')}${l.by ? ' · ' + esc(l.by) : ''}</div></div><b style="color:${l.qty > 0 ? 'var(--ok)' : 'var(--bad)'}">${l.qty > 0 ? '+' : ''}${fmtNum(l.qty)}</b></div>`).join('') || '<div class="empty">-</div>'}</div></div>`,
    foot:`<div class="sp"></div>${can('stock.adjust') ? `<button class="btn" onclick="openAdjust('${id}')">ปรับลด</button>` : ''}${can('stock.in') ? `<button class="btn p" onclick="openStockIn('${id}')">+ รับเข้า</button>` : ''}`});
}
function openProdForm(p = {}) {
  if (!can('catalog.edit')) return deny();
  const isNew = !p.id;
  openModal({title: isNew ? 'เพิ่มรายการสต็อก' : 'แก้ไขรายการสต็อก', body:`<form class="form" onsubmit="event.preventDefault();saveProd('${p.id || ''}')">
    <label>ประเภท<select class="inp" name="kind">${Object.entries(KIND_TH).map(([k, l]) => opt(k, l, p.kind || 'supply')).join('')}</select></label>
    <label>รหัส SKU<input class="inp" name="sku" value="${esc(p.sku)}"></label>
    <label class="full">ชื่อรายการ<input class="inp" name="name" value="${esc(p.name)}" required></label>
    <label>หน่วยนับ (ใช้ใน BOM)<input class="inp" name="unit" value="${esc(p.unit || 'ชิ้น')}" placeholder="เช่น U, ml, ชิ้น, shot" required></label>
    <label>จุดสั่งซื้อ (ขั้นต่ำ)<input class="inp" type="number" min="0" step="any" name="min" value="${p.min ?? 5}"></label>
    <label>ราคาทุนต่อหน่วย<input class="inp" type="number" min="0" step="any" name="cost" value="${p.cost ?? ''}" required></label>
    <label>ราคาขาย (เฉพาะสินค้าขาย)<input class="inp" type="number" min="0" name="price" value="${p.price ?? 0}"></label>
    <label class="full">ผูกกับแผนภาพใบหน้า<select class="inp" name="markType"><option value="">— ไม่ผูก —</option>${['botox', 'filler'].map(k => opt(k, `${MARK_TYPES[k].label} — ดึงยอด ${MARK_TYPES[k].unit} จากจุดที่มาร์ก`, p.markType)).join('')}</select></label>
    ${isNew ? `<label>เลขล็อตเริ่มต้น<input class="inp" name="lot"></label><label>วันหมดอายุ<input class="inp" type="date" name="exp"></label><label>จำนวนเริ่มต้น<input class="inp" type="number" min="0" step="any" name="qty" value="0"></label>` : ''}
    <button hidden></button></form>`,
    foot:`${p.id ? `<button class="btn danger" onclick="delItem('products','${p.id}')">ลบ</button><div class="sp"></div>` : ''}<button class="btn" onclick="closeModal()">ยกเลิก</button><button class="btn p" onclick="$('#modal form').requestSubmit()">บันทึก</button>`});
}
function saveProd(id) {
  if (!can('catalog.edit')) return deny();
  const f = formData(); ['cost', 'price', 'min'].forEach(k => f[k] = Number(f[k]) || 0);
  const base = {kind:f.kind, sku:f.sku, name:f.name, unit:f.unit, min:f.min, cost:f.cost, price:f.price, markType:f.markType};
  if (id) Object.assign(byId('products', id), base);
  else { const p = {id:uid(), ...base, lots:[], stock:0}; db.products.push(p); if (Number(f.qty) > 0) addLot(p, {lot:f.lot, exp:f.exp, qty:Number(f.qty)}, 'ยอดเริ่มต้น'); invTab = f.kind; }
  audit(id ? 'แก้ไขรายการสต็อก' : 'เพิ่มรายการสต็อก', f.name);
  save(); closeModal(); route(); toast('บันทึกแล้ว', 'ok');
}
function openStockIn(id) {
  if (!can('stock.in')) return deny();
  const p = byId('products', id);
  openModal({title:'รับเข้าคลัง', body:`<p style="margin-top:0"><b>${esc(p.name)}</b> <span class="muted">คงเหลือ ${fmtNum(p.stock)} ${esc(p.unit)}</span></p><form class="form" onsubmit="event.preventDefault();stockIn('${id}')">
    <label>จำนวนที่รับ (${esc(p.unit)})<input class="inp" type="number" min="0.01" step="any" name="qty" required></label>
    <label>ราคาทุนต่อ ${esc(p.unit)}<input class="inp" type="number" min="0" step="any" name="cost" value="${p.cost}"></label>
    <label>เลขล็อต (Lot no.)<input class="inp" name="lot" required></label>
    <label>วันหมดอายุ<input class="inp" type="date" name="exp" ${p.kind === 'supply' ? 'required' : ''}></label>
    <label class="full">หมายเหตุ / ผู้จำหน่าย / เลข PO<input class="inp" name="note"></label><button hidden></button></form>`,
    foot:`<button class="btn" onclick="closeModal()">ยกเลิก</button><button class="btn p" onclick="$('#modal form').requestSubmit()">รับเข้า</button>`});
}
function stockIn(id) {
  if (!can('stock.in')) return deny();
  const f = formData(), q = Number(f.qty), p = byId('products', id); if (!(q > 0)) return;
  addLot(p, {lot:f.lot, exp:f.exp, qty:q, cost:f.cost}, f.note || 'รับเข้า');
  audit('รับสินค้าเข้า', `${p.name} +${fmtNum(q)} ${p.unit} · Lot ${f.lot}`);
  save(); closeModal(); route(); toast(`รับเข้า ${fmtNum(q)} ${p.unit} แล้ว`, 'ok');
}
function openAdjust(id) {
  if (!can('stock.adjust')) return deny();
  const p = byId('products', id), lots = p.lots.filter(l => l.qty > 0).sort(lotSort);
  if (!lots.length) return toast('ไม่มีสต็อกให้ปรับ', 'bad');
  const def = lots.find(x => expState(x.exp) === 'expired')?.id || lots[0].id;
  openModal({title:'ปรับลดสต็อก', body:`<p style="margin-top:0"><b>${esc(p.name)}</b></p><form class="form" onsubmit="event.preventDefault();adjustStock('${id}')">
    <label class="full">ล็อต<select class="inp" name="lotId">${lots.map(l => opt(l.id, `${l.lot}${l.exp ? ' · Exp ' + thDate(l.exp) : ''} · คงเหลือ ${fmtNum(l.qty)}${expState(l.exp) === 'expired' ? ' (หมดอายุ)' : ''}`, def)).join('')}</select></label>
    <label>จำนวนที่ตัดออก (${esc(p.unit)})<input class="inp" type="number" min="0.01" step="any" name="qty" required></label>
    <label>เหตุผล<select class="inp" name="reason">${ADJ_REASONS.map(r => opt(r, r, '')).join('')}</select></label>
    <label class="full">หมายเหตุ<input class="inp" name="note"></label><button hidden></button></form>`,
    foot:`<button class="btn" onclick="closeModal()">ยกเลิก</button><button class="btn p" onclick="$('#modal form').requestSubmit()">ตัดสต็อก</button>`});
}
function adjustStock(id) {
  if (!can('stock.adjust')) return deny();
  const f = formData(), p = byId('products', id), l = p.lots.find(x => x.id === f.lotId), q = Number(f.qty);
  if (!l || !(q > 0)) return;
  if (q > l.qty) return toast(`ล็อตนี้มีเพียง ${fmtNum(l.qty)} ${p.unit}`, 'bad');
  const lot = l.lot;
  takeStock(p, q, 'adjust', `${f.reason}${f.note ? ' · ' + f.note : ''}`, null, l.id, true);
  audit('ปรับลดสต็อก', `${p.name} -${fmtNum(q)} ${p.unit} · Lot ${lot} · ${f.reason}`);
  save(); closeModal(); route(); toast('ปรับสต็อกแล้ว', 'ok');
}

/* ================= Staff ================= */
let staffMonth = monthOf(today());
function viewStaff() {
  const all = can('staff.all'), um = can('users.manage');
  $('#topActions').innerHTML = `<input type="month" class="inp" value="${staffMonth}" onchange="staffMonth=this.value||monthOf(today());route()">${um ? `<button class="btn p" onclick="openStaffForm()">+ เพิ่มพนักงาน</button>` : ''}`;
  if (!all) $('#pageTitle').textContent = 'ผลงาน & ค่าคอมของฉัน';
  const inv = db.invoices.filter(i => monthOf(i.date) === staffMonth);
  const us = db.usages.filter(u => monthOf(u.date) === staffMonth);
  const rows = db.staff.filter(s => all || s.id === me.staffId).map(s => { const sales = inv.filter(i => i.staffId === s.id).reduce((a, b) => a + b.total, 0); return {s, sales, comm:sales * s.commission / 100, cases:us.filter(u => u.staffId === s.id).length}; });
  if (!rows.length) { $('#view').innerHTML = '<div class="card empty">บัญชีนี้ยังไม่ได้เชื่อมกับข้อมูลพนักงาน กรุณาติดต่อผู้จัดการ</div>'; return; }
  $('#view').innerHTML = `<div class="grid g3" style="margin-bottom:18px">
    <div class="card kpi"><div class="l">${all ? 'ยอดขายรวม (มีผู้ขาย)' : 'ยอดขายของฉัน'}</div><div class="v">${baht(rows.reduce((a, b) => a + b.sales, 0))}</div></div>
    <div class="card kpi"><div class="l">ค่าคอมมิชชันรวม</div><div class="v">${baht(rows.reduce((a, b) => a + b.comm, 0))}</div></div>
    <div class="card kpi"><div class="l">เคสที่ให้บริการ</div><div class="v">${fmt(rows.reduce((a, b) => a + b.cases, 0))}</div><div class="d">รวมการตัดคอร์ส</div></div></div>
  <div class="card" style="padding:6px 8px"><table><thead><tr><th>พนักงาน</th><th>ตำแหน่ง</th><th>เบอร์โทร</th><th class="num">เคส</th><th class="num">ยอดขาย</th><th class="num">อัตราคอม</th><th class="num">ค่าคอม</th><th></th></tr></thead><tbody>
    ${rows.map(({s, sales, comm, cases}) => `<tr><td><div style="display:flex;align-items:center;gap:10px"><div class="avatar" style="background:${s.color}22;color:${s.color}">${esc(s.name.replace(/^(พญ\.|นพ\.|คุณ)/, '')[0])}</div><b>${esc(s.name)}</b></div></td><td><span class="chip mute">${s.role}</span></td><td class="muted">${esc(s.phone || '')}</td><td class="num">${cases}</td><td class="num">${baht(sales)}</td><td class="num">${s.commission}%</td><td class="num"><b>${baht(comm)}</b></td><td class="num">${um ? `<button class="btn sm ghost" onclick="openStaffForm(byId('staff','${s.id}'))">แก้ไข</button>` : ''}</td></tr>`).join('')}</tbody></table></div>`;
}
function openStaffForm(s = {}) {
  if (!can('users.manage')) return deny();
  openModal({title: s.id ? 'แก้ไขพนักงาน' : 'เพิ่มพนักงาน', body:`<form class="form" onsubmit="event.preventDefault();saveStaff('${s.id || ''}')">
    <label class="full">ชื่อ - นามสกุล<input class="inp" name="name" value="${esc(s.name)}" required></label>
    <label>ตำแหน่ง<select class="inp" name="role">${ROLES.map(r => opt(r, r, s.role)).join('')}</select></label><label>เบอร์โทร<input class="inp" name="phone" value="${esc(s.phone)}"></label>
    <label>อัตราค่าคอม (%)<input class="inp" type="number" min="0" max="100" step="0.5" name="commission" value="${s.commission ?? 5}"></label><label>สีในตาราง<input class="inp" type="color" name="color" value="${s.color || '#b9826a'}" style="height:40px;padding:4px"></label><button hidden></button></form>`,
    foot:`${s.id ? `<button class="btn danger" onclick="delItem('staff','${s.id}')">ลบ</button><div class="sp"></div>` : ''}<button class="btn" onclick="closeModal()">ยกเลิก</button><button class="btn p" onclick="$('#modal form').requestSubmit()">บันทึก</button>`});
}
function saveStaff(id) {
  if (!can('users.manage')) return deny();
  const f = formData(); f.commission = Number(f.commission) || 0;
  if (id) Object.assign(byId('staff', id), f); else db.staff.push({id:uid(), ...f});
  audit(id ? 'แก้ไขข้อมูลพนักงาน' : 'เพิ่มพนักงาน', `${f.name} · คอม ${f.commission}%`);
  save(); closeModal(); route(); toast('บันทึกแล้ว', 'ok');
}

/* ================= Reports ================= */
let repMonth = monthOf(today());
function viewReports() {
  $('#topActions').innerHTML = `<input type="month" class="inp" value="${repMonth}" onchange="repMonth=this.value||monthOf(today());route()"><button class="btn" onclick="exportCSV()">⬇ ส่งออก CSV</button>`;

  const byType = {service:0, course:0, product:0}, byCat = {}, byItem = {};

  const byC = {}; inv.forEach(i => byC[i.customerId] = (byC[i.customerId] || 0) + i.total);

  $('#view').innerHTML = `<div class="grid g4">
    <div class="card kpi"><div class="l"><span class="kic">${IC.cash}</span>รายได้สุทธิ</div><div style="display:flex;justify-content:space-between;align-items:flex-end;gap:8px"><div><div class="v">${baht(total)}</div><div class="d">${inv.length} บิล</div></div>${spark(daily.slice(0, Math.max(2, monthOf(today()) === repMonth ? Number(today().slice(8)) : nd)).map(d => d.v))}</div></div>
    <div class="card kpi"><div class="l"><span class="kic vio">${IC.pkg}</span>เฉลี่ยต่อบิล</div><div class="v">${baht(inv.length ? total / inv.length : 0)}</div><div class="d">ต่อการชำระ 1 ครั้ง</div></div>

  ${costRow}<div class="card" style="margin-top:18px"><h3>รายได้รายวัน <small>${repMonth === monthOf(today()) ? 'เดือนนี้' : ''}</small></h3>${bars(daily, 200)}</div>
  <div class="grid g3" style="margin-top:18px">

function exportCSV() {
  if (!can('reports.view')) return deny();
  audit('ส่งออกรายงาน CSV', repMonth);
  const inv = db.invoices.filter(i => monthOf(i.date) === repMonth);
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const rows = [['เลขที่', 'วันที่', 'เวลา', 'HN', 'ลูกค้า', 'รายการ', 'ผู้ขาย', 'ส่วนลด', 'ยอดสุทธิ', 'ชำระโดย']].concat(inv.map(i => [i.no, i.date, i.time, byId('customers', i.customerId)?.hn, custName(i.customerId), i.items.map(x => `${x.name} x${x.qty}`).join('; '), staffName(i.staffId), i.discount, i.total, i.method]));
  const blob = new Blob(['﻿' + rows.map(r => r.map(q).join(',')).join('\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `esteem-sales-${repMonth}.csv`; a.click();
}

function setTheme(k) {

function toggleRolePerm(role, perm, on) {
  if (!can('users.manage') || role === 'admin') return deny();
  const set = new Set(db.rolePerms[role] || []); on ? set.add(perm) : set.delete(perm);
  db.rolePerms[role] = [...set];
  audit(on ? 'เพิ่มสิทธิ์' : 'ถอนสิทธิ์', `${ROLE_DEF[role]}: ${PERM_GROUPS.flatMap(g => g[1]).find(p => p[0] === perm)[1]}`);
  toast('บันทึกสิทธิ์แล้ว', 'ok');
}

const activeAdmins = (exceptId) => db.users.filter(u => u.role === 'admin' && u.active && u.id !== exceptId).length;
async function saveUser(id) {
  if (!can('users.manage')) return deny();
  const f = formData(), un = f.username.trim().toLowerCase(), active = f.active === '1';
  if (db.users.some(u => u.username.toLowerCase() === un && u.id !== id)) return toast('ชื่อผู้ใช้นี้มีอยู่แล้ว', 'bad');
  if (id === me.id && (!active || f.role !== 'admin')) return toast('ไม่สามารถปิดใช้งานหรือลดสิทธิ์บัญชีของตัวเองได้', 'bad');
  if (id && byId('users', id).role === 'admin' && (!active || f.role !== 'admin') && !activeAdmins(id)) return toast('ต้องมีผู้จัดการที่ใช้งานอยู่อย่างน้อย 1 คน', 'bad');
  if (f.pw && f.pw.length < 8) return toast('รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร', 'bad');
  let u = id ? byId('users', id) : null;
  if (!u) { u = {id:uid(), lastLogin:''}; db.users.push(u); }
  Object.assign(u, {username:un, name:f.name.trim(), role:f.role, staffId:f.staffId, active});
  if (f.pw) await setPassword(u, f.pw);
  audit(id ? 'แก้ไขผู้ใช้' : 'เพิ่มผู้ใช้', `${un} · ${ROLE_DEF[f.role]}${active ? '' : ' (ปิดใช้งาน)'}${f.pw && id ? ' · ตั้งรหัสผ่านใหม่' : ''}`);
  save(); closeModal(); route(); toast('บันทึกผู้ใช้แล้ว', 'ok');
}
function delUser(id) {
  const u = byId('users', id);
  if (id === me.id) return toast('ไม่สามารถลบบัญชีของตัวเองได้', 'bad');
  if (u.role === 'admin' && !activeAdmins(id)) return toast('ต้องมีผู้จัดการที่ใช้งานอยู่อย่างน้อย 1 คน', 'bad');
  confirmBox('ลบผู้ใช้', `ต้องการลบบัญชี <b>${esc(u.username)}</b> หรือไม่? (แนะนำให้ "ปิดใช้งาน" แทน เพื่อเก็บประวัติไว้)`, () => {
    db.users = db.users.filter(x => x.id !== id); audit('ลบผู้ใช้', u.username); closeModal(); route(); toast('ลบผู้ใช้แล้ว');
  }, 'ลบ');
}

  if (role) {
    const d = DEMO_USERS.find(x => x.role === role || x.username === role), u = d && db.users.find(x => x.username === d.username && x.active);
    if (u) { me = null; startSession(u); u.lastLogin = new Date().toISOString(); audit('เข้าสู่ระบบ (เดโม)'); }
    history.replaceState(null, '', location.pathname + (location.hash || ''));
  }
  if (me || restoreSession()) {
    const topC = () => { const c = {}; db.treatments.forEach(t => c[t.customerId] = (c[t.customerId] || 0) + 1); return Object.entries(c).sort((x, y) => y[1] - x[1])[0]?.[0]; };
    if (open === 'patient') location.hash = '#customer/' + topC();
    if (open === 'history') location.hash = '#history/' + topC();
    route();
    if (open === 'tx' && can('opd.view')) { const t = db.treatments.filter(x => x.marks.length >= 10).sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time))[0]; if (t) openTreatment(t.id); }
  } else showLogin();
})();
</script>
